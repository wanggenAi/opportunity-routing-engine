name: jiangsu-money-flow-live

on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * *"
  pull_request:
    paths:
      - "src/jiangsu_money_flow.py"
      - "src/regional_adapters.py"
      - "scripts/collect_jiangsu_money_flow.py"
      - "tests/test_jiangsu_money_flow.py"
      - "data/source_registry.csv"
      - ".github/workflows/jiangsu-money-flow-live.yml"
  push:
    paths:
      - "src/jiangsu_money_flow.py"
      - "src/regional_adapters.py"
      - "scripts/collect_jiangsu_money_flow.py"
      - "tests/test_jiangsu_money_flow.py"
      - "data/source_registry.csv"
      - ".github/workflows/jiangsu-money-flow-live.yml"

permissions:
  contents: read

jobs:
  collect-jiangsu-money-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect latest official Jiangsu economic release
        run: |
          python scripts/collect_jiangsu_money_flow.py \
            --output .local/jiangsu_money_flow.json

      - name: Validate Jiangsu money-flow evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/jiangsu_money_flow.json').read_text(encoding='utf-8'))
          if data.get('source_id') != 'JS_STATS' or data.get('data_available') is not True:
              raise SystemExit('Jiangsu statistics source did not produce available data')
          if data.get('geography') != 'Jiangsu':
              raise SystemExit('unexpected geography')
          if data.get('freshness', {}).get('status') not in {'FRESH', 'AGING'}:
              raise SystemExit(f'latest Jiangsu release is not fresh enough: {data.get("freshness")}')
          if not data.get('observation_period'):
              raise SystemExit('missing observation period')

          metrics = {item['signal_id']: item for item in data.get('metrics', [])}
          required = {
              'JS_INDUSTRIAL_VALUE_ADDED_YOY',
              'JS_FIXED_INVESTMENT_YOY',
              'JS_MANUFACTURING_INVESTMENT_YOY',
              'JS_INFRASTRUCTURE_INVESTMENT_YOY',
              'JS_REAL_ESTATE_INVESTMENT_YOY',
              'JS_EQUIPMENT_INVESTMENT_YOY',
              'JS_RETAIL_YOY',
              'JS_RMB_DEPOSIT_LEVEL_TRILLION_CNY',
              'JS_RMB_DEPOSIT_YOY',
              'JS_RMB_LOAN_LEVEL_TRILLION_CNY',
              'JS_RMB_LOAN_YOY',
          }
          missing = sorted(required - metrics.keys())
          if missing:
              raise SystemExit(f'missing required Jiangsu money-flow metrics: {missing}')

          deposits = float(metrics['JS_RMB_DEPOSIT_LEVEL_TRILLION_CNY']['value'])
          loans = float(metrics['JS_RMB_LOAN_LEVEL_TRILLION_CNY']['value'])
          if not 10 < deposits < 60 or not 10 < loans < 60:
              raise SystemExit(f'Jiangsu financial levels outside broad corruption guard: {deposits}, {loans}')

          for key in ('index', 'release'):
              meta = data['provenance'][key]
              parsed = urlparse(meta['url'])
              if parsed.scheme != 'https' or parsed.hostname != 'tj.jiangsu.gov.cn':
                  raise SystemExit(f'unexpected Jiangsu provenance URL: {meta["url"]}')
              if not meta.get('payload_sha256'):
                  raise SystemExit(f'missing provenance hash: {key}')

          print('release_title=', data['release_title'])
          print('publication_date=', data['publication_date'])
          print('observation_period=', data['observation_period'])
          print('metric_count=', data['metric_count'])
          print('metrics=', json.dumps(metrics, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Jiangsu money-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiangsu-money-flow-evidence
          path: .local/jiangsu_money_flow.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
