name: pbc-money-flow-live

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    paths:
      - "src/pbc_money_flow.py"
      - "src/html_ingest.py"
      - "scripts/collect_pbc_money_flow.py"
      - "tests/test_pbc_money_flow.py"
      - "data/source_registry.csv"
      - ".github/workflows/pbc-money-flow-live.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect latest official PBC money-flow report
        run: |
          python scripts/collect_pbc_money_flow.py \
            --output .local/pbc_money_flow.json

      - name: Validate current evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/pbc_money_flow.json').read_text(encoding='utf-8'))
          if data.get('source_id') != 'CN_PBOC' or data.get('data_available') is not True:
              raise SystemExit('PBC live source did not produce available data')
          latest = data['latest_release']
          if latest.get('core_metric_count', 0) < 4:
              raise SystemExit('PBC core metrics incomplete')
          if not str(latest.get('title', '')).endswith('金融统计数据报告'):
              raise SystemExit('unexpected PBC report title')
          for key in ('index', 'report'):
              meta = data['provenance'][key]
              parsed = urlparse(meta['url'])
              if parsed.scheme != 'https' or parsed.hostname != 'www.pbc.gov.cn':
                  raise SystemExit(f'unexpected PBC provenance URL: {meta["url"]}')
              if not meta.get('payload_sha256'):
                  raise SystemExit('missing PBC payload hash')

          metrics = latest.get('metrics') or {}
          evidence = latest.get('metric_evidence') or {}
          if set(metrics) != set(evidence):
              raise SystemExit('PBC metric evidence coverage diverges from serialized metrics')
          if latest.get('metric_count') != len(metrics):
              raise SystemExit('PBC metric_count diverges from serialized metrics')
          for key, metric in metrics.items():
              if metric.get('value') is None:
                  raise SystemExit('null metric must be omitted rather than serialized')
              lineage = evidence.get(key) or {}
              if not str(lineage.get('value_excerpt', '')).strip():
                  raise SystemExit(f'PBC metric lacks source value excerpt: {key}')
              if 'yoy_pct' in metric and not str(lineage.get('yoy_excerpt', '')).strip():
                  raise SystemExit(f'PBC YoY metric lacks source change excerpt: {key}')

          required = {'social_financing_stock', 'social_financing_flow_ytd', 'm2_balance', 'm1_balance', 'm0_balance'}
          if not required.issubset(metrics):
              raise SystemExit(f'PBC required metrics missing: {sorted(required - set(metrics))}')
          print('title=', latest['title'])
          print('release_date=', latest['release_date'])
          print('freshness=', data['freshness'])
          print('metrics=', json.dumps(metrics, ensure_ascii=False, sort_keys=True))
          print('metric_evidence=', json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload PBC evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbc-money-flow-evidence
          path: .local/pbc_money_flow.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
