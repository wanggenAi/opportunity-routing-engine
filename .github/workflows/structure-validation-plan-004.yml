name: structure-validation-plan-004

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/structure_validation_planning.py"
      - "src/structural_commercialization.py"
      - "scripts/build_structure_validation_plan.py"
      - "scripts/build_commercial_structure_probe.py"
      - "tests/test_structure_validation_planning.py"
      - "data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/**"
      - "data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/**"
      - "data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/**"
      - ".github/workflows/structure-validation-plan-004.yml"

permissions:
  contents: read

concurrency:
  group: structure-validation-plan-004
  cancel-in-progress: false

jobs:
  build-validation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild upstream structural recurrence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          python scripts/build_structural_recurrence_probe.py \
            --parent-research-evidence data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/evidence.json \
            --parent-reviewed data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/reviewed_observations.json \
            --research-evidence data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/evidence.json \
            --reviewed data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/reviewed_observations.json \
            --alignments data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/concept_alignments.json \
            --output .local/structural_recurrence_probe.json

      - name: Rebuild commercial structure probe
        run: |
          python scripts/build_commercial_structure_probe.py \
            --recurrence .local/structural_recurrence_probe.json \
            --candidate data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/candidate.json \
            --evidence data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/evidence.json \
            --output .local/commercial_structure_probe.json

      - name: Build bounded validation queue and packets
        run: |
          python scripts/build_structure_validation_plan.py \
            --commercial-structure .local/commercial_structure_probe.json \
            --queue-output .local/structure_validation_queue.json \
            --packets-output .local/structure_validation_packets.json

      - name: Validate planning-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.task_count' .local/structure_validation_queue.json)" = "3"
          test "$(jq -r '.packet_count' .local/structure_validation_packets.json)" = "3"
          test "$(jq -r '.business_promotion' .local/structure_validation_queue.json)" = "NOT_PROMOTED"
          test "$(jq -r '.business_promotion' .local/structure_validation_packets.json)" = "NOT_PROMOTED"
          jq -e '[.tasks[].target_gate] | sort == ["COMPOUNDING","LOCAL_CASE_PANEL","LOCAL_PAID_MANDATE"]' .local/structure_validation_queue.json >/dev/null
          jq -e '[.tasks[] | select(.task_role=="CORE_MISSING_DIMENSION") | .target_gate] == ["COMPOUNDING"]' .local/structure_validation_queue.json >/dev/null
          if jq -e '.. | objects | has("opportunity_score") or has("commercial_score") or has("route_testable") or has("core_business_candidate") or has("evidence_state")' .local/structure_validation_packets.json >/dev/null; then
            echo "Truth promotion leaked into validation packets" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Structure Validation Plan 004"
            echo
            jq -r '"- candidate: `\(.candidate_id)`"' .local/structure_validation_queue.json
            jq -r '"- tasks: `\(.task_count)`"' .local/structure_validation_queue.json
            jq -r '"- packets: `\(.packet_count)`"' .local/structure_validation_packets.json
            jq -r '"- targets: `\(.target_counts)`"' .local/structure_validation_queue.json
            echo
            echo "These packets are evidence-collection instructions only. The single core missing dimension remains COMPOUNDING; local case and paid-mandate tasks are prerequisites/corroboration, not promotion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation planning artifact
        uses: actions/upload-artifact@v4
        with:
          name: structure-validation-plan-004-state
          path: |
            .local/commercial_structure_probe.json
            .local/structure_validation_queue.json
            .local/structure_validation_packets.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
