name: customs-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/customs-source-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Jiangsu official trade corroboration source
        run: |
          python - <<'PY'
          from src.html_ingest import PublicHtmlClient, html_to_document, normalize_whitespace

          client = PublicHtmlClient(
              source_id='JS_GOV',
              allowed_hosts={'jszwb.jiangsu.gov.cn'},
              timeout_seconds=20,
              retries=1,
              max_response_bytes=5_000_000,
          )
          urls = [
              'https://jszwb.jiangsu.gov.cn/col/col71797/index.html',
              'https://jszwb.jiangsu.gov.cn/art/2026/8/14/art_71797_11816221.html',
          ]
          for i, url in enumerate(urls):
              env = client.fetch(url, request_name=f'js_trade_corroboration.{i}')
              doc = html_to_document(env.html, base_url=env.url)
              print('URL=', env.url)
              print('SHA256=', env.payload_sha256)
              print('TITLE=', doc.get('title'))
              print('TEXT_PREFIX=', normalize_whitespace(doc.get('text',''))[:3500])
              relevant = [x for x in doc.get('links', []) if '71797' in x.get('url','') or '进出口' in x.get('text','') or '海关' in x.get('text','')]
              print('RELEVANT_LINKS=', relevant[:80])
          PY
