name: customs-source-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/customs-source-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current official GACC monthly/detail structure
        run: |
          python - <<'PY'
          import re
          from src.gacc_trade_flow import GaccTradeFlowAdapter, parse_html_tables
          from src.html_ingest import html_to_document, normalize_whitespace

          adapter = GaccTradeFlowAdapter()
          discovery = adapter.discover_latest()
          print('selected_year=', discovery.get('selected_year'))
          print('location_link_count=', len(discovery['location_links']))
          print('specific_area_link_count=', len(discovery['specific_area_links']))
          print('location_links=', discovery['location_links'])
          print('specific_area_links=', discovery['specific_area_links'])

          for table_no, links in ((8, discovery['location_links']), (11, discovery['specific_area_links'])):
              print(f'TABLE_{table_no}_DETAILS_BEGIN')
              for i, url in enumerate(links[-2:]):
                  env = adapter.client.fetch(url, request_name=f'diagnostic.table_{table_no}.{i}')
                  doc = html_to_document(env.html, base_url=env.url)
                  plain = normalize_whitespace(re.sub(r'<[^>]+>', ' ', env.html))
                  print('DETAIL_URL=', env.url)
                  print('TITLE=', doc.get('title'))
                  print('TEXT_PREFIX=', plain[:1500])
                  print('LINKS=', doc.get('links', [])[:30])
                  rows = parse_html_tables(env.html, base_url=env.url)
                  print('ROW_COUNT=', len(rows))
                  for row in rows[:12]:
                      print('ROW=', [cell['text'][:160] for cell in row])
              print(f'TABLE_{table_no}_DETAILS_END')
          PY
