name: sensor-evidence-channel-coverage-021

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["live-observation-coverage-016"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: sensor-evidence-channel-coverage-021
  cancel-in-progress: false

jobs:
  reconcile-evidence-channel-coverage:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve exact live Observation coverage run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            status="${{ github.event.workflow_run.status }}"
            conclusion="${{ github.event.workflow_run.conclusion }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"
          else
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow live-observation-coverage-016.yml \
              --branch main \
              --limit 1 \
              --json databaseId,status,conclusion,headSha \
              --jq '.[0] // empty')"
            if [[ -z "$run_json" || "$run_json" == "null" ]]; then
              echo "No main live Observation coverage run exists" >&2
              exit 1
            fi
            run_id="$(jq -r '.databaseId // empty' <<<"$run_json")"
            status="$(jq -r '.status // empty' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            head_sha="$(jq -r '.headSha // empty' <<<"$run_json")"
          fi
          if [[ -z "$run_id" || "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "Refusing non-success live Observation coverage run: id=${run_id:-unknown} status=${status:-unknown} conclusion=${conclusion:-unknown}" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download exact live Observation coverage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream/live_coverage
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name live-observation-coverage-016-state \
            --dir .upstream/live_coverage
          test -f .upstream/live_coverage/live_observation_coverage_016.json

      - name: Build evidence channel coverage
        run: |
          mkdir -p .local
          python scripts/build_sensor_evidence_channel_coverage.py \
            --source-registry data/source_registry.csv \
            --candidates data/sensor_candidates.json \
            --channel-registry data/evidence_channel_registry.json \
            --live-observation-coverage .upstream/live_coverage/live_observation_coverage_016.json \
            --output .local/sensor_evidence_channel_coverage_021.json

      - name: Prove current sensing capability and remaining blind spots
        shell: bash
        run: |
          set -euo pipefail
          state=.local/sensor_evidence_channel_coverage_021.json
          test "$(jq -r '.schema_version' "$state")" = "sensor-evidence-channel-coverage.v1"
          test "$(jq -r '.channel_count' "$state")" = "6"
          test "$(jq -r '.production_live_channel_count' "$state")" = "4"
          test "$(jq -r '.observed_channel_count' "$state")" = "4"
          test "$(jq -r '.blind_spot_channel_count' "$state")" = "2"
          test "$(jq -r '.latest_live_observation_coverage.production_live_source_count' "$state")" = "9"
          test "$(jq -r '.latest_live_observation_coverage.adapter_supported_source_count' "$state")" = "9"
          test "$(jq -r '.latest_live_observation_coverage.observed_production_source_count' "$state")" = "9"
          jq -e '.observed_channel_ids | sort == ["HARD_BEHAVIOR_MONEY","LOCAL_REALITY","OFFICIAL_STRUCTURAL_BASELINE","REPRESENTATIVE_RESEARCH"]' "$state" >/dev/null
          jq -e '.blind_spot_channel_ids | sort == ["SEARCH_INTENT","SOCIAL_PUBLIC_DISCOURSE"]' "$state" >/dev/null
          jq -e '.unmapped_operational_source_ids == [] and .unmapped_candidate_source_ids == []' "$state" >/dev/null
          jq -e '.mapped_observed_production_source_ids | sort == ["CN_CUSTOMS","CN_NBS","CN_PBOC","CN_PBOC_JS","EJY365_XZ_LINKED","JS_STATS","QM","XZ_GGZY","XZ_GOV_FINANCE_DEMAND"]' "$state" >/dev/null
          jq -e '.channels[] | select(.channel_id == "SEARCH_INTENT") | .coverage_state == "REGISTERED_NONLIVE_ONLY" and .observed_production_source_ids == [] and .manual_surface_source_ids == ["BAIDU_INDEX"]' "$state" >/dev/null
          jq -e '.channels[] | select(.channel_id == "SOCIAL_PUBLIC_DISCOURSE") | .coverage_state == "REGISTERED_NONLIVE_ONLY" and .observed_production_source_ids == [] and (.candidate_source_ids | length) == 4 and .candidate_automation_ready_source_ids == []' "$state" >/dev/null
          jq -e '.channels[] | select(.channel_id == "REPRESENTATIVE_RESEARCH") | .coverage_state == "OBSERVED_PRODUCTION" and .production_live_source_ids == ["QM"] and .observed_production_source_ids == ["QM"]' "$state" >/dev/null
          jq -e '.truth_boundaries | index("SOURCE_COVERAGE_NE_EVIDENCE_CHANNEL_COVERAGE") != null and index("ONE_OBSERVED_SOURCE_NE_CHANNEL_COMPLETENESS") != null and index("OBSERVED_CHANNEL_NE_REPRESENTATIVE_POPULATION_COVERAGE") != null and index("SEARCH_SALIENCE_NE_PAID_DEMAND") != null and index("SOCIAL_DISCOURSE_NE_MARKET_DEMAND") != null and index("UNKNOWN_NE_PASS") != null' "$state" >/dev/null
          if jq -e '.. | objects | has("payer") or has("paid_need") or has("route_testable") or has("opportunity_score") or has("commercial_score") or has("business_promotion") or has("taxonomy_promotion")' "$state" >/dev/null; then
            echo "Evidence channel coverage leaked downstream commercial or ontology truth" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Sensor Evidence Channel Coverage 021"
            echo
            jq -r '"- governed evidence channels: `\(.channel_count)`"' .local/sensor_evidence_channel_coverage_021.json
            jq -r '"- production-observed channels: `\(.observed_channel_count)`"' .local/sensor_evidence_channel_coverage_021.json
            jq -r '"- explicit blind-spot channels: `\(.blind_spot_channel_count)`"' .local/sensor_evidence_channel_coverage_021.json
            jq -r '"- observed channels: `\(.observed_channel_ids)`"' .local/sensor_evidence_channel_coverage_021.json
            jq -r '"- blind spots: `\(.blind_spot_channel_ids)`"' .local/sensor_evidence_channel_coverage_021.json
            echo "- 9/9 source ingestion does not imply complete evidence-channel coverage or representative population truth"
            echo "- latest live coverage run: `${{ steps.resolve.outputs.run_id }}` / `${{ steps.resolve.outputs.head_sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence channel coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-evidence-channel-coverage-021-state
          path: .local/sensor_evidence_channel_coverage_021.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
