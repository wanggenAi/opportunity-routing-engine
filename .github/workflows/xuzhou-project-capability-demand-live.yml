name: xuzhou-project-capability-demand-live

on:
  workflow_dispatch:
  schedule:
    - cron: "50 5 * * 1,4"
  pull_request:
    paths:
      - "src/xuzhou_project_capability_demand.py"
      - "scripts/collect_xuzhou_project_capability_demand.py"
      - "tests/test_xuzhou_project_capability_demand.py"
      - "data/source_registry.csv"
      - ".github/workflows/xuzhou-project-capability-demand-live.yml"
  push:
    paths:
      - "src/xuzhou_project_capability_demand.py"
      - "scripts/collect_xuzhou_project_capability_demand.py"
      - "tests/test_xuzhou_project_capability_demand.py"
      - "data/source_registry.csv"
      - ".github/workflows/xuzhou-project-capability-demand-live.yml"

permissions:
  contents: read

jobs:
  collect-xuzhou-project-capability-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect recent official Xuzhou project capability demand
        run: |
          python scripts/collect_xuzhou_project_capability_demand.py \
            --limit 10 \
            --output .local/xuzhou_project_capability_demand.json

      - name: Validate project capability-demand evidence contract
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/xuzhou_project_capability_demand.json').read_text(encoding='utf-8'))
          if data.get('source_id') != 'XZ_GGZY':
              raise SystemExit(f'unexpected source: {data.get("source_id")}')
          if data.get('evidence_kind') != 'PROJECT_PERSONNEL_CAPABILITY_DEMAND':
              raise SystemExit(f'unexpected evidence kind: {data.get("evidence_kind")}')
          if data.get('discovery', {}).get('item_count', 0) < 5:
              raise SystemExit(f'too few official transport tenders discovered: {data.get("discovery", {}).get("item_count")}')
          if data.get('event_count', 0) < 2:
              raise SystemExit(f'too few tenders with explicit personnel requirements: {data.get("event_count")}')
          if data.get('requirement_count', 0) < 2:
              raise SystemExit(f'too few explicit role requirements: {data.get("requirement_count")}')
          if data.get('error_count', 0) > 3:
              raise SystemExit(f'too many detail parse errors: {data.get("errors")}')
          if data.get('employment_tie_event_count', 0) < 1:
              raise SystemExit('no explicit bidder-employee transaction constraint observed')
          if data.get('social_insurance_proof_event_count', 0) < 1:
              raise SystemExit('no explicit social-insurance proof constraint observed')

          required_boundaries = {
              'PROJECT_REQUIREMENT_IS_NOT_LABOR_SHORTAGE',
              'DEMAND_IS_NOT_SURPLUS_RESOURCE',
              'BIDDER_EMPLOYEE_TIE_IS_A_TRANSACTION_CONSTRAINT',
              'NO_PERSON_PROFILE',
              'NO_HUMAN_CAPABILITY_UNDERUSE_INFERENCE',
              'NO_OPPORTUNITY_INFERENCE',
          }
          missing = sorted(required_boundaries - set(data.get('truth_boundaries', [])))
          if missing:
              raise SystemExit(f'missing truth boundaries: {missing}')

          discovery_meta = data['discovery']['provenance']
          durl = urlparse(discovery_meta['url'])
          if durl.scheme != 'https' or durl.hostname != 'ggzy.zwb.xz.gov.cn' or not discovery_meta.get('payload_sha256'):
              raise SystemExit(f'invalid discovery provenance: {discovery_meta}')

          latest = None
          allowed_roles = {'PROJECT_MANAGER', 'PROJECT_TECHNICAL_LEAD', 'PROJECT_LEAD'}
          for event in data['events']:
              parsed = urlparse(event['url'])
              if parsed.scheme != 'https' or parsed.hostname != 'ggzy.zwb.xz.gov.cn':
                  raise SystemExit(f'unexpected event URL: {event["url"]}')
              meta = event['provenance']
              purl = urlparse(meta['url'])
              if purl.scheme != 'https' or purl.hostname != 'ggzy.zwb.xz.gov.cn' or not meta.get('payload_sha256'):
                  raise SystemExit(f'invalid event provenance: {meta}')
              event_date = date.fromisoformat(event['publication_date'])
              latest = max(latest, event_date) if latest else event_date
              if event.get('capability_requirement_count') != len(event.get('requirements', [])):
                  raise SystemExit(f'requirement count mismatch: {event}')
              for req in event['requirements']:
                  if req.get('role') not in allowed_roles or not req.get('requirement_excerpt'):
                      raise SystemExit(f'invalid role requirement: {req}')
                  forbidden = {'candidate_name', 'person_name', 'phone', 'id_number', 'availability', 'willingness', 'surplus'}
                  leaked = forbidden.intersection(req.keys())
                  if leaked:
                      raise SystemExit(f'person/supply inference fields leaked: {sorted(leaked)}')

          if latest is None or (date.today() - latest).days > 120:
              raise SystemExit(f'latest capability-demand tender is stale: {latest}')

          print('discovered=', data['discovery']['item_count'])
          print('events=', data['event_count'])
          print('requirements=', data['requirement_count'])
          print('errors=', data['error_count'])
          print('employment_tie_events=', data['employment_tie_event_count'])
          print('social_insurance_events=', data['social_insurance_proof_event_count'])
          print('latest_publication_date=', latest.isoformat())
          print('events_json=', json.dumps(data['events'], ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Xuzhou project capability-demand evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuzhou-project-capability-demand-evidence
          path: .local/xuzhou_project_capability_demand.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
