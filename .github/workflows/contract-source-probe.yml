name: contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/contract-source-probe.yml"

permissions:
  contents: read

jobs:
  probe-official-contract-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe China Government Procurement contract search surface
        run: |
          python - <<'PY'
          import re
          import urllib.error
          import urllib.request

          urls = [
              "https://htgs.ccgp.gov.cn/GS8/contractpublish/index",
              "http://htgs.ccgp.gov.cn/GS8/contractpublish/index",
              "https://htgs.ccgp.gov.cn/GS8/contractpublish/search",
              "http://htgs.ccgp.gov.cn/GS8/contractpublish/search",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; opportunity-routing-engine/1.0; evidence-source-probe)",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
          }
          for url in urls:
              print("\n===", url, "===")
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(500_000)
                      charset = response.headers.get_content_charset() or "utf-8"
                      try:
                          text = body.decode(charset, errors="replace")
                      except LookupError:
                          text = body.decode("utf-8", errors="replace")
                      print("status", response.status)
                      print("final_url", response.geturl())
                      print("content_type", response.headers.get("content-type"))
                      print("bytes", len(body))
                      print("title", re.findall(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)[:3])
                      print("forms", re.findall(r"<form[^>]*action=[\"']?([^\"' >]+)", text, re.I)[:20])
                      print("inputs", sorted(set(re.findall(r"<input[^>]*name=[\"']([^\"']+)", text, re.I)))[:100])
                      print("selects", sorted(set(re.findall(r"<select[^>]*name=[\"']([^\"']+)", text, re.I)))[:100])
                      print("scripts", re.findall(r"<script[^>]*src=[\"']([^\"']+)", text, re.I)[:100])
                      for needle in ("project", "采购", "合同", "search", "ajax", "url:"):
                          hits = [line.strip() for line in text.splitlines() if needle.lower() in line.lower()]
                          print("HITS", needle, hits[:30])
              except urllib.error.HTTPError as exc:
                  print("HTTPError", exc.code, exc.reason, "url", exc.geturl())
                  try:
                      print(exc.read(4000).decode("utf-8", errors="replace"))
                  except Exception:
                      pass
              except Exception as exc:
                  print(type(exc).__name__, repr(exc))
          PY
