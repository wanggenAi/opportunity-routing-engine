name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify exact project-id contract lookup
        run: |
          python - <<'PY'
          import json
          import urllib.request

          URL = "https://ggzy.zwb.xz.gov.cn/inteligentsearchnew/rest/esinteligentsearch/getFullTextDataNew"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "application/json,text/javascript,*/*;q=0.8",
              "Content-Type": "application/json;charset=utf-8",
              "Referer": "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004007/list.html",
          }
          IDS = [
              "JSZC-320300-XZTY-G2026-0001",
              "JSZC-320300-XZTY-G2026-0002",
              "JSZC-320300-WYKJ-G2026-0027",
              "JSZC-320300-XZTY-G2026-0004",
              "JSZC-320300-XZTY-G2026-0005",
              "JSZC-320300-WYKJ-G2026-0034",
          ]

          def query(project_id):
              payload = {
                  "token":"", "pn":0, "rn":"20", "sdt":"", "edt":"",
                  "wd":project_id, "inc_wd":"", "exc_wd":"",
                  "fields":"title;content", "cnum":"002",
                  "sort":"{\"webdate\":\"0\"}", "ssort":"title", "cl":1200,
                  "terminal":"",
                  "condition":[{"fieldName":"categorynum","isLike":True,"likeType":2,"equal":"003004007"}],
                  "time":None, "highlights":"title;content", "statistics":None,
                  "unionCondition":None, "accuracy":"", "noParticiple":"1",
                  "searchRange":None, "isBusiness":"1",
              }
              raw = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = urllib.request.Request(URL, data=raw, headers=HEADERS, method="POST")
              with urllib.request.urlopen(req, timeout=15) as r:
                  obj = json.loads(r.read(1_500_000).decode("utf-8-sig"))
              result = obj.get("result") or {}
              print("PROJECT", project_id, "TOTAL", result.get("totalcount"))
              for record in (result.get("records") or [])[:20]:
                  content = str(record.get("content") or "")
                  print("RECORD", json.dumps({
                      "title": record.get("title"),
                      "linkurl": record.get("linkurl"),
                      "webdate": record.get("webdate"),
                      "exact_in_content": project_id in content,
                      "content": content[:1800],
                  }, ensure_ascii=False))

          for project_id in IDS:
              query(project_id)
          PY
