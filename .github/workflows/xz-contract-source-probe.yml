name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Xuzhou contract request encoding and site identity
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          LIST = "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004007/list.html"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*;q=0.8",
              "Referer": LIST,
          }

          def fetch(url, timeout=8):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read(1200000)
                  enc = r.headers.get_content_charset() or "utf-8"
                  return r.status, r.geturl(), r.headers.get("content-type", ""), raw.decode(enc, errors="replace")

          status, final, ct, html = fetch(LIST)
          print("LIST", status, final, ct, "CHARS", len(html))
          print("\n=== INLINE SITE IDENTITY ===")
          for idx, line in enumerate(html.splitlines()):
              low = line.lower()
              if any(k in low for k in ("siteguid", "categorynum", "003004007", "getparams", "utilajaxmethod")):
                  print(f"{idx+1:04d}: {line.strip()[:5000]}")

          scripts = [urllib.parse.urljoin(LIST, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)]
          scripts = [u for u in scripts if u.startswith("https://ggzy.zwb.xz.gov.cn/")]
          print("\n=== TARGET SCRIPT DEFINITIONS ===")
          needles = ("function utilajaxmethod", "utilajaxmethod =", "function getparams", "getparams =", "siteguid", "getpageinfolist")
          for url in scripts:
              try:
                  s, f, c, js = fetch(url, timeout=8)
              except Exception as exc:
                  print("SCRIPT_ERROR", url, type(exc).__name__, repr(exc))
                  continue
              lines = js.splitlines()
              hits = [i for i, line in enumerate(lines) if any(n in line.lower() for n in needles)]
              if not hits:
                  continue
              print("\nSCRIPT", url, "STATUS", s, "CHARS", len(js))
              shown = set()
              for i in hits:
                  for j in range(max(0, i-12), min(len(lines), i+28)):
                      if j in shown:
                          continue
                      shown.add(j)
                      print(f"{j+1:04d}: {lines[j]}")
          PY
