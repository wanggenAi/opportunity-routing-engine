name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Xuzhou contract page API request shape
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          ORIGIN = "https://ggzy.zwb.xz.gov.cn"
          REFERER = ORIGIN + "/jyxx/003004/003004007/list.html"
          SITE_GUID = "7eb5f7f1-9041-43ad-8e13-8fcb82ea831a"
          PARAMS = {
              "siteGuid": SITE_GUID,
              "categoryNum": "003004007",
              "kw": "content",
              "pageIndex": "0",
              "pageSize": "20",
          }
          ENDPOINTS = [
              ORIGIN + "/EpointWebBuilder/rest/frontAppCustomAction/getPageInfoList",
              ORIGIN + "/EpointWebBuilder_new/rest/frontAppNotNeedLoginAction/getPageInfoList",
          ]
          BASE_HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "application/json,text/javascript,*/*;q=0.8",
              "Referer": REFERER,
              "X-Requested-With": "XMLHttpRequest",
          }

          def call(label, url, *, data=None, extra_headers=None):
              headers = dict(BASE_HEADERS)
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = r.read(1500000)
                      text = raw.decode(r.headers.get_content_charset() or "utf-8", errors="replace")
                      print("\n===", label, "===")
                      print("STATUS", r.status, "FINAL", r.geturl(), "CT", r.headers.get("content-type"), "BYTES", len(raw))
                      print("BODY", text[:12000])
                      try:
                          obj = json.loads(text)
                          print("TOP_KEYS", sorted(obj) if isinstance(obj, dict) else type(obj).__name__)
                          custom = obj.get("custom") if isinstance(obj, dict) else None
                          if isinstance(custom, str):
                              try:
                                  custom = json.loads(custom)
                              except Exception:
                                  pass
                          if isinstance(custom, dict):
                              print("CUSTOM_KEYS", sorted(custom))
                              for key in ("infolist", "infoList", "rows", "data", "total"):
                                  if key in custom:
                                      value = custom[key]
                                      print("CUSTOM", key, json.dumps(value, ensure_ascii=False)[:12000])
                      except Exception as exc:
                          print("JSON_PARSE", type(exc).__name__, repr(exc))
              except Exception as exc:
                  print("\n===", label, "===")
                  print(type(exc).__name__, repr(exc))

          encoded = urllib.parse.urlencode(PARAMS)
          for endpoint in ENDPOINTS:
              call("GET " + endpoint, endpoint + "?" + encoded)
              call(
                  "POST_FORM " + endpoint,
                  endpoint,
                  data=encoded.encode("utf-8"),
                  extra_headers={"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"},
              )
          PY
