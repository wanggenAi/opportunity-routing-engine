name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe contract list loader with bounded script fetches
        run: |
          python - <<'PY'
          import concurrent.futures
          import re
          import urllib.parse
          import urllib.request

          LIST = "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004007/list.html"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*;q=0.8",
              "Referer": LIST,
          }

          def fetch(url, timeout=6):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read(1000000)
                  enc = r.headers.get_content_charset() or "utf-8"
                  return r.status, r.geturl(), r.headers.get("content-type", ""), raw.decode(enc, errors="replace")

          status, final, ct, html = fetch(LIST)
          print("LIST", status, final, ct, "CHARS", len(html))
          scripts = [urllib.parse.urljoin(LIST, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)]
          scripts = [u for u in scripts if u.startswith("https://ggzy.zwb.xz.gov.cn/")]
          print("SCRIPTS")
          for u in scripts:
              print(u)

          print("\nINLINE")
          for idx, line in enumerate(html.splitlines()):
              low = line.lower()
              if any(k in low for k in ("003004007", "ajax", "api", "search", "query", "pageindex", "pagesize", "categorynum", "url:")):
                  print(f"{idx+1:04d}: {line.strip()[:5000]}")

          def inspect(url):
              try:
                  s, f, c, js = fetch(url, timeout=6)
                  lines = js.splitlines()
                  hit_indexes = [i for i, line in enumerate(lines) if any(k in line.lower() for k in ("003004007", "ajax", "url:", "pageindex", "pagesize", "categorynum", "search", "query", "getlist", "jyxx"))]
                  out = [f"SCRIPT {url} STATUS {s} CHARS {len(js)}"]
                  shown = set()
                  for i in hit_indexes:
                      for j in range(max(0, i-6), min(len(lines), i+10)):
                          if j not in shown:
                              shown.add(j)
                              out.append(f"{j+1:04d}: {lines[j]}")
                  return "\n".join(out)
              except Exception as exc:
                  return f"SCRIPT_ERROR {url} {type(exc).__name__} {exc!r}"

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for output in pool.map(inspect, scripts):
                  print("\n" + output)
          PY
