name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Xuzhou contract list loader
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          LIST = "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004007/list.html"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "text/html,application/xhtml+xml,application/javascript,*/*;q=0.8",
              "Referer": LIST,
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read(2000000)
                  enc = r.headers.get_content_charset() or "utf-8"
                  try:
                      text = raw.decode(enc, errors="strict")
                  except Exception:
                      text = raw.decode("utf-8", errors="replace")
                  return r.status, r.geturl(), r.headers.get("content-type", ""), raw, text

          status, final, ct, raw, html = fetch(LIST)
          print("LIST", status, final, ct, "BYTES", len(raw))
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          print("SCRIPTS", scripts)
          print("\n=== RELEVANT HTML ===")
          for idx, line in enumerate(html.splitlines()):
              lower = line.lower()
              if any(k in lower for k in ("003004007", "list", "ajax", "page", "query", "search", "api", "category", "jyxx")):
                  print(f"{idx+1:04d}: {line.strip()[:5000]}")

          print("\n=== SCRIPT CONTEXTS ===")
          for src in scripts:
              url = urllib.parse.urljoin(LIST, src)
              if not url.startswith("https://ggzy.zwb.xz.gov.cn/"):
                  continue
              try:
                  s, f, c, body, js = fetch(url)
                  lines = js.splitlines()
                  hits = []
                  for idx, line in enumerate(lines):
                      lower = line.lower()
                      if any(k in lower for k in ("003004007", "categorynum", "url:", "ajax", "pageindex", "pagesize", "query", "search", "jyxx", "getlist")):
                          hits.append(idx)
                  if hits:
                      print("\nSCRIPT", url, "STATUS", s, "BYTES", len(body))
                      shown = set()
                      for idx in hits:
                          for j in range(max(0, idx-8), min(len(lines), idx+12)):
                              if j in shown:
                                  continue
                              shown.add(j)
                              print(f"{j+1:04d}: {lines[j]}")
              except Exception as exc:
                  print("SCRIPT_ERROR", url, type(exc).__name__, repr(exc))
          PY
