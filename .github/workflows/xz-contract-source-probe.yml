name: xz-contract-source-probe

on:
  push:
    branches:
      - codex/official-contract-source-probe
    paths:
      - ".github/workflows/xz-contract-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect-xuzhou-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect Xuzhou contract list request wrapper
        run: |
          python - <<'PY'
          import concurrent.futures
          import re
          import urllib.parse
          import urllib.request

          LIST = "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004007/list.html"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OpportunityRoutingEngine/0.1)",
              "Accept": "text/html,application/javascript,*/*;q=0.8",
              "Referer": LIST,
          }

          def fetch(url, timeout=7):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read(1200000)
                  return raw.decode(r.headers.get_content_charset() or "utf-8", errors="replace")

          html = fetch(LIST)
          scripts = [urllib.parse.urljoin(LIST, x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)]
          explicit = urllib.parse.urljoin(LIST, "js/list.js")
          if explicit not in scripts:
              scripts.append(explicit)
          scripts = [u for u in scripts if u.startswith("https://ggzy.zwb.xz.gov.cn/")]
          print("SCRIPT_URLS")
          for u in scripts:
              print(u)

          needles = (
              "utilajaxmethod", "getparams", "getpageinfolist", "frontappcustomaction",
              "pageindex", "pagesize", "categorynum", "controlname", "siteguid"
          )

          def inspect(url):
              try:
                  text = fetch(url)
              except Exception as exc:
                  return f"ERROR {url} {type(exc).__name__} {exc!r}"
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if any(n in line.lower() for n in needles)]
              if not hits:
                  return f"NO_HITS {url}"
              out = [f"SOURCE {url} CHARS {len(text)}"]
              shown = set()
              for i in hits:
                  for j in range(max(0, i-10), min(len(lines), i+18)):
                      if j in shown:
                          continue
                      shown.add(j)
                      out.append(f"{j+1:04d}: {lines[j]}")
              return "\n".join(out)

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(inspect, scripts):
                  if not result.startswith("NO_HITS"):
                      print("\n" + result)
          PY
