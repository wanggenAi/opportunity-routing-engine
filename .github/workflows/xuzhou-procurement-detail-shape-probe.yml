name: xuzhou-procurement-detail-shape-probe

on:
  push:
    paths:
      - ".github/workflows/xuzhou-procurement-detail-shape-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official procurement detail response shape
        shell: python
        run: |
          import hashlib
          import re
          from urllib.request import Request, urlopen

          url = "https://ggzy.zwb.xz.gov.cn/jyxx/003004/003004002/20260910/fa34bda1-6f69-4512-b5dc-731bf34418ef.html"
          profiles = {
              "engine": {
                  "Accept": "text/html,application/xhtml+xml;q=0.9,*/*;q=0.5",
                  "User-Agent": "OpportunityRoutingEngine/0.1 (+public-evidence-ingest)",
              },
              "browser": {
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.5",
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0",
              },
          }
          markers = ["项目编号", "项目名称", "预算金额", "采购人信息", "JSZC-320300-XZTY-G2026-0004"]
          for name, headers in profiles.items():
              request = Request(url, headers=headers, method="GET")
              with urlopen(request, timeout=30) as response:
                  body = response.read(5_000_000)
                  content_type = response.headers.get("Content-Type", "")
              try:
                  html = body.decode("utf-8")
                  encoding = "utf-8"
              except UnicodeDecodeError:
                  html = body.decode("gb18030")
                  encoding = "gb18030"
              print(f"PROFILE={name}")
              print(f"status_bytes={len(body)} content_type={content_type} encoding={encoding} sha256={hashlib.sha256(body).hexdigest()[:16]}")
              for marker in markers:
                  print(f"contains[{marker}]={marker in html}")
              print(f"iframe_count={len(re.findall(r'<iframe\\b', html, flags=re.I))}")
              print(f"script_count={len(re.findall(r'<script\\b', html, flags=re.I))}")
              print(f"escaped_project_label={'\\u9879\\u76ee\\u7f16\\u53f7' in html.lower()}")
              iframe_srcs = re.findall(r'<iframe\\b[^>]*?src=[\"\']([^\"\']+)', html, flags=re.I)
              print(f"iframe_srcs={iframe_srcs[:5]}")
              for pattern_name, pattern in {
                  "content_url": r'(?:contentUrl|contenturl|detailUrl|detailurl)[\"\']?\\s*[:=]\\s*[\"\']([^\"\']+)',
                  "ajax_url": r'(?:url)[\"\']?\\s*[:=]\\s*[\"\']([^\"\']+)',
              }.items():
                  matches = re.findall(pattern, html, flags=re.I)
                  print(f"{pattern_name}_candidates={matches[:5]}")
