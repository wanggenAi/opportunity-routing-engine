name: broad-discovery-run-001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/**"
      - "data/research_missions/china_primary_broad_discovery.json"
      - "src/research_control_plane.py"
      - "scripts/build_research_mission.py"
      - "scripts/assess_research_coverage.py"
      - "tests/test_broad_discovery_run_001.py"
      - ".github/workflows/broad-discovery-run-001.yml"

permissions:
  contents: read

concurrency:
  group: broad-discovery-run-001
  cancel-in-progress: false

jobs:
  validate-executed-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exact research plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          python scripts/build_research_mission.py \
            --mission data/research_missions/china_primary_broad_discovery.json \
            --as-of-date 2026-09-14 \
            --plan-output .local/research_mission_plan.json \
            --coverage-output .local/planning_only_coverage.json

      - name: Assess executed research coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/assess_research_coverage.py \
            --mission data/research_missions/china_primary_broad_discovery.json \
            --plan .local/research_mission_plan.json \
            --evidence data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/evidence.json \
            --output .local/executed_research_coverage.json

      - name: Require broad discovery coverage only
        shell: bash
        run: |
          set -euo pipefail
          state="$(jq -r '.state' .local/executed_research_coverage.json)"
          authorized="$(jq -r '.broad_discovery_use_authorized' .local/executed_research_coverage.json)"
          blockers="$(jq -c '.blockers' .local/executed_research_coverage.json)"
          if [[ "$state" != "BROAD_DISCOVERY_READY" ]]; then
            echo "Research run did not reach BROAD_DISCOVERY_READY: $state blockers=$blockers" >&2
            exit 1
          fi
          if [[ "$authorized" != "true" ]]; then
            echo "Broad discovery authorization was not granted" >&2
            exit 1
          fi
          if [[ "$blockers" != "[]" ]]; then
            echo "Coverage still has blockers: $blockers" >&2
            exit 1
          fi
          if jq -e '.. | objects | has("opportunity_score") or has("commercial_score") or has("route_testable") or has("payer")' .local/executed_research_coverage.json >/dev/null; then
            echo "Commercial truth leaked into research coverage artifact" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Broad Discovery Run 001"
            echo
            jq -r '"- coverage state: `\(.state)`"' .local/executed_research_coverage.json
            jq -r '"- evidence records: `\(.evidence_count)`"' .local/executed_research_coverage.json
            jq -r '"- independent hosts: `\(.independent_host_count)`"' .local/executed_research_coverage.json
            jq -r '"- source families: `\(.source_family_count)`"' .local/executed_research_coverage.json
            jq -r '"- lane counts: `\(.lane_counts)`"' .local/executed_research_coverage.json
            jq -r '"- blockers: `\(.blockers)`"' .local/executed_research_coverage.json
            jq -r '"- cautions: `\(.cautions)`"' .local/executed_research_coverage.json
            echo
            echo "BROAD_DISCOVERY_READY authorizes broad-discovery interpretation only. It does not promote a Pattern, payer, route, opportunity, or business."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload executed research artifact
        uses: actions/upload-artifact@v4
        with:
          name: broad-discovery-run-001-state
          path: |
            .local/research_mission_plan.json
            .local/planning_only_coverage.json
            .local/executed_research_coverage.json
            data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/evidence.json
            data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/dynamic_terms.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
