name: commercial-structure-probe-003

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/structural_commercialization.py"
      - "src/latent_value_discovery.py"
      - "src/emergent_taxonomy.py"
      - "scripts/build_commercial_structure_probe.py"
      - "scripts/build_structural_recurrence_probe.py"
      - "tests/test_structural_commercialization.py"
      - "data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/**"
      - "data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/**"
      - "data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/**"
      - ".github/workflows/commercial-structure-probe-003.yml"

permissions:
  contents: read

concurrency:
  group: commercial-structure-probe-003
  cancel-in-progress: false

jobs:
  validate-commercial-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild upstream structural recurrence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          python scripts/build_structural_recurrence_probe.py \
            --parent-research-evidence data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/evidence.json \
            --parent-reviewed data/research_runs/BROAD_DISCOVERY_RUN_001_2026-09-14/reviewed_observations.json \
            --research-evidence data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/evidence.json \
            --reviewed data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/reviewed_observations.json \
            --alignments data/research_runs/STRUCTURAL_RECURRENCE_RUN_002_2026-09-14/concept_alignments.json \
            --output .local/structural_recurrence_probe.json

      - name: Build commercial structure probe
        run: |
          python scripts/build_commercial_structure_probe.py \
            --recurrence .local/structural_recurrence_probe.json \
            --candidate data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/candidate.json \
            --evidence data/research_runs/COMMERCIAL_STRUCTURE_PROBE_003_2026-09-14/evidence.json \
            --output .local/commercial_structure_probe.json

      - name: Validate conservative structure boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.commercial_structure_state' .local/commercial_structure_probe.json)" = "STRUCTURE_VALIDATION_READY"
          test "$(jq -r '.business_promotion' .local/commercial_structure_probe.json)" = "NOT_PROMOTED"
          test "$(jq -r '.candidate_validation_state' .local/commercial_structure_probe.json)" = "VALIDATION_READY"
          test "$(jq -r '.dimensions.STANDARDIZABILITY.state' .local/commercial_structure_probe.json)" = "EVIDENCED"
          test "$(jq -r '.dimensions.COMPLEMENTARY_ACTOR_STRUCTURE.state' .local/commercial_structure_probe.json)" = "EVIDENCED"
          test "$(jq -r '.dimensions.REGENERATING_EVENT_FLOW.state' .local/commercial_structure_probe.json)" = "EVIDENCED"
          test "$(jq -r '.dimensions.REPEAT_MONETIZATION.state' .local/commercial_structure_probe.json)" = "EVIDENCED"
          test "$(jq -r '.dimensions.COMPOUNDING.state' .local/commercial_structure_probe.json)" = "UNKNOWN"
          jq -e '.missing_dimensions == ["COMPOUNDING"]' .local/commercial_structure_probe.json >/dev/null
          if jq -e '.. | objects | has("opportunity_score") or has("commercial_score") or has("route_testable") or has("core_business_candidate")' .local/commercial_structure_probe.json >/dev/null; then
            echo "Commercial promotion leaked into structure probe" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Commercial Structure Probe 003"
            echo
            jq -r '"- concept: `\(.candidate_concept)`"' .local/commercial_structure_probe.json
            jq -r '"- structure state: `\(.commercial_structure_state)`"' .local/commercial_structure_probe.json
            jq -r '"- evidence: `\(.evidence_count)` from `\(.source_count)` sources"' .local/commercial_structure_probe.json
            jq -r '"- missing dimensions: `\(.missing_dimensions)`"' .local/commercial_structure_probe.json
            jq -r '"- business promotion: `\(.business_promotion)`"' .local/commercial_structure_probe.json
            echo
            echo "STRUCTURE_VALIDATION_READY means the mechanism deserves targeted real-world validation. It is not an archetype, route-testable opportunity or business entry decision."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload commercial structure artifact
        uses: actions/upload-artifact@v4
        with:
          name: commercial-structure-probe-003-state
          path: |
            .local/structural_recurrence_probe.json
            .local/commercial_structure_probe.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
