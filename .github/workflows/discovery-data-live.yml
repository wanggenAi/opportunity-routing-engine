name: discovery-data-live

on:
  workflow_dispatch:
  schedule:
    # 09:20 Asia/Shanghai every Monday. Weekly is enough for source/schema drift.
    - cron: "20 1 * * 1"
  push:
    paths:
      - "src/network_ingest.py"
      - "src/nbs_adapter.py"
      - "src/macro_watchlist.py"
      - "scripts/collect_nbs.py"
      - "scripts/collect_macro_watchlist.py"
      - "data/nbs_macro_watchlist.csv"
      - ".github/workflows/discovery-data-live.yml"

permissions:
  contents: read

jobs:
  nbs-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe current NBS public release API
        run: |
          python scripts/collect_nbs.py probe \
            --output .local/nbs_live_probe.json

      - name: Discover selected monthly indicator catalogs
        run: |
          python scripts/collect_nbs.py discover \
            --page monthData \
            --keyword 居民消费价格 \
            --keyword 社会消费品零售 \
            --max-nodes 400 \
            --limit-per-keyword 5 \
            --output .local/nbs_month_catalog_discovery.json

      - name: Inspect current CPI and retail catalogs
        run: |
          python scripts/collect_nbs.py inspect \
            --page monthData \
            --cid 5c7452825c7c4dcba391db5ca7f335c5 \
            --output .local/nbs_cpi_catalog.json
          python scripts/collect_nbs.py inspect \
            --page monthData \
            --cid d0cb882c7f27443ab6b3ef9421901961 \
            --output .local/nbs_retail_catalog.json

      - name: Collect latest materially populated macro watchlist
        run: |
          python scripts/collect_macro_watchlist.py \
            --watchlist data/nbs_macro_watchlist.csv \
            --output .local/nbs_macro_watchlist_snapshot.json \
            --require-any-available

      - name: Show bounded discovery summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.local').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'=== {path.name} ===')
              print(json.dumps(data, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Upload live evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbs-live-evidence
          path: .local/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
