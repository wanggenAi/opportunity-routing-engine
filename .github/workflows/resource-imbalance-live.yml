name: resource-imbalance-live

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * *"
  push:
    paths:
      - "src/live_imbalance_ledger.py"
      - "src/procurement_lifecycle.py"
      - "src/provider_capacity_evidence.py"
      - "src/resource_imbalance.py"
      - "src/resource_signal_adapters.py"
      - "src/regional_adapters.py"
      - "src/resource_underuse_adapters.py"
      - "src/xuzhou_agency_resource_feed.py"
      - "src/xuzhou_procurement_blockers.py"
      - "src/xuzhou_procurement_contracts.py"
      - "src/xuzhou_procurement_results.py"
      - "src/provider_evidence_seeds.py"
      - "src/validation_queue.py"
      - "scripts/build_live_resource_imbalance.py"
      - "scripts/build_procurement_lifecycle.py"
      - "scripts/build_pair_validation_queue.py"
      - "scripts/collect_regional.py"
      - "scripts/collect_resource_underuse.py"
      - "scripts/collect_xuzhou_procurement_blockers.py"
      - "scripts/collect_xuzhou_procurement_contracts.py"
      - "scripts/collect_xuzhou_procurement_results.py"
      - "scripts/verify_xuzhou_procurement_result_seeds.py"
      - "data/xuzhou_procurement_result_seeds.csv"
      - "tests/test_live_imbalance_ledger.py"
      - "tests/test_live_imbalance_capacity_cli.py"
      - "tests/test_procurement_lifecycle.py"
      - "tests/test_provider_capacity_evidence.py"
      - "tests/test_resource_imbalance.py"
      - "tests/test_xuzhou_procurement_blockers.py"
      - "tests/test_xuzhou_procurement_contracts.py"
      - "tests/test_xuzhou_procurement_results.py"
      - "tests/test_provider_evidence_seeds.py"
      - "tests/test_validation_queue.py"
      - ".github/workflows/resource-imbalance-live.yml"

permissions:
  contents: read

jobs:
  xuzhou-live-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect bounded Xuzhou procurement need evidence
        run: |
          mkdir -p .local
          python scripts/collect_regional.py xuzhou-procurement-events \
            --limit 30 \
            --output .local/xz_procurement_events.json

      - name: Collect explicit Xuzhou procurement blockers
        run: |
          # Re-fetch classified current tenders, require exact project identity, and
          # emit only source-explicit qualification/access or no-subcontract routing
          # constraints. Generic procurement boilerplate never becomes a blocker.
          python scripts/collect_xuzhou_procurement_blockers.py \
            --procurement-json .local/xz_procurement_events.json \
            --output .local/xz_procurement_blockers.json

      - name: Backfill proven Xuzhou capability providers
        run: |
          python scripts/collect_xuzhou_procurement_results.py \
            --pages 15 \
            --capability-only \
            --max-details 40 \
            --require-awards \
            --output .local/xz_procurement_awards.json

      - name: Verify research-seeded official procurement results
        run: |
          python scripts/verify_xuzhou_procurement_result_seeds.py \
            --seeds data/xuzhou_procurement_result_seeds.csv \
            --require-verified \
            --output .local/xz_seeded_procurement_awards.json

      - name: Collect exact-project Xuzhou procurement contracts
        run: |
          python scripts/collect_xuzhou_procurement_contracts.py \
            --input-json .local/xz_procurement_events.json \
            --input-json .local/xz_seeded_procurement_awards.json \
            --max-records-per-project 100 \
            --output .local/xz_procurement_contracts.json

      - name: Build exact procurement lifecycle
        run: |
          python scripts/build_procurement_lifecycle.py \
            --tender-json .local/xz_procurement_events.json \
            --result-json .local/xz_procurement_awards.json \
            --result-json .local/xz_seeded_procurement_awards.json \
            --contract-json .local/xz_procurement_contracts.json \
            --output .local/xz_procurement_lifecycle.json

      - name: Collect native Xuzhou resource evidence
        run: |
          python scripts/collect_resource_underuse.py xuzhou-public-assets \
            --limit 30 \
            --output .local/xz_public_asset_underuse.json

      - name: Collect Xuzhou agency resource evidence
        run: |
          python scripts/collect_resource_underuse.py xuzhou-agency-assets \
            --limit 30 \
            --output .local/xz_agency_asset_underuse.json

      - name: Build truth-preserving Resource Imbalance ledger
        run: |
          # No provider-capacity artifact is supplied here unless real reviewed
          # capacity evidence exists. Historical awards must remain underuse UNKNOWN.
          python scripts/build_live_resource_imbalance.py \
            --procurement-json .local/xz_procurement_events.json \
            --provider-json .local/xz_procurement_awards.json \
            --provider-json .local/xz_seeded_procurement_awards.json \
            --resource-json .local/xz_public_asset_underuse.json \
            --resource-json .local/xz_agency_asset_underuse.json \
            --blocker-json .local/xz_procurement_blockers.json \
            --lifecycle-json .local/xz_procurement_lifecycle.json \
            --output .local/xz_resource_imbalance_ledger.json

      - name: Build PAIR_HYPOTHESIS validation queue
        run: |
          python scripts/build_pair_validation_queue.py \
            --ledger .local/xz_resource_imbalance_ledger.json \
            --output .local/xz_pair_validation_queue.json

      - name: Assert canonical promotion gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.local/xz_resource_imbalance_ledger.json').read_text(encoding='utf-8'))
          seeded = json.loads(Path('.local/xz_seeded_procurement_awards.json').read_text(encoding='utf-8'))
          contracts = json.loads(Path('.local/xz_procurement_contracts.json').read_text(encoding='utf-8'))
          blockers = json.loads(Path('.local/xz_procurement_blockers.json').read_text(encoding='utf-8'))
          lifecycle = json.loads(Path('.local/xz_procurement_lifecycle.json').read_text(encoding='utf-8'))
          queue = json.loads(Path('.local/xz_pair_validation_queue.json').read_text(encoding='utf-8'))

          print('source_input_counts:', data['source_input_counts'])
          print('signal_counts:', data['signal_counts'])
          print('status_counts:', data['status_counts'])
          print('blocking_reason_counts:', data['blocking_reason_counts'])
          print('verified_seed_count:', seeded['verified_seed_count'])
          print('seeded_award_count:', seeded['award_count'])
          print('contract_project_count:', contracts['project_count'])
          print('exact_contract_count:', contracts['contract_count'])
          print('procurement_blocker_count:', blockers['blocker_count'])
          print('lifecycle_stage_counts:', lifecycle['stage_counts'])
          print('lifecycle_promotion_allowed_count:', lifecycle['promotion_allowed_count'])
          print('validation_queue_target_counts:', queue['target_counts'])

          if seeded['verified_seed_count'] < 1 or seeded['award_count'] < 1:
              raise SystemExit('navigation seeds produced no freshly verified official award evidence')
          for award in seeded['awards']:
              if not award.get('project_id') or not award.get('project_name'):
                  raise SystemExit('verified seeded award lacks exact project identity')

          if blockers.get('query_strategy') != 'EXACT_PROJECT_ID_REVALIDATION_PLUS_EXPLICIT_TEXT_ONLY':
              raise SystemExit('blocker collection policy drifted from explicit exact-project evidence')
          if blockers.get('blocker_scope') != 'EXACT_NEED_SIGNAL':
              raise SystemExit('procurement blockers are not scoped to exact canonical needs')
          for blocker in blockers.get('blockers', []):
              project_id = blocker.get('project_id')
              expected_need_signal_id = f'LIVE_NEED::XZ_GGZY::{project_id}' if project_id else None
              if not project_id or blocker.get('need_signal_id') != expected_need_signal_id:
                  raise SystemExit('procurement blocker exact project/need identity drifted')
              if blocker.get('evidence_state') != 'OBSERVED':
                  raise SystemExit('procurement blocker emitted non-observed evidence')
              if blocker.get('blocker_basis') not in {
                  'EXPLICIT_SPECIFIC_QUALIFICATION_REQUIREMENT',
                  'EXPLICIT_NO_SUBCONTRACT_OR_TRANSFER_RULE',
              }:
                  raise SystemExit('procurement blocker came from an unapproved semantic basis')
              if blocker.get('blocker_type') not in {'CAPABILITY_GAP', 'COORDINATION_GAP'}:
                  raise SystemExit('procurement blocker used an unapproved canonical type')
              provenance = blocker.get('provenance') or {}
              if not provenance.get('payload_sha256') or provenance.get('http_status') != 200:
                  raise SystemExit('procurement blocker lacks auditable first-party provenance')

          if contracts.get('query_strategy') != 'EXACT_PROJECT_ID_SEARCH_THEN_EXACT_FIELD_REVALIDATION':
              raise SystemExit('contract source is not exact-project revalidated')
          requested_contract_projects = set(contracts.get('requested_project_ids') or [])
          if not requested_contract_projects:
              raise SystemExit('contract source queried no project IDs')
          for contract in contracts.get('contracts', []):
              if contract.get('project_id') not in requested_contract_projects:
                  raise SystemExit('contract artifact emitted unrequested project identity')
              if contract.get('payer_actor') is not None:
                  raise SystemExit('contract purchaser was incorrectly promoted to payer')
              if contract.get('settled_amount_rmb') is not None:
                  raise SystemExit('contract announcement manufactured settled amount')
              if contract.get('settlement_proven') is not False:
                  raise SystemExit('contract announcement manufactured settlement proof')
              if not (contract.get('provenance') or {}).get('payload_sha256'):
                  raise SystemExit('contract evidence lacks auditable response provenance')

          if lifecycle.get('join_policy') != 'EXACT_PROJECT_ID_ONLY':
              raise SystemExit('procurement lifecycle is not exact-project-id-only')
          seen_projects = set()
          for record in lifecycle['records']:
              project_id = record.get('project_id')
              if not project_id or project_id in seen_projects:
                  raise SystemExit('lifecycle project identity is missing or duplicated')
              seen_projects.add(project_id)
              if record.get('exact_join_key') != project_id:
                  raise SystemExit('lifecycle exact join key drifted from project_id')
              for evidence in record.get('result_evidence', []):
                  if evidence.get('project_id') != project_id:
                      raise SystemExit('result evidence crossed exact project identity')
              for evidence in record.get('contract_evidence', []):
                  if evidence.get('project_id') != project_id:
                      raise SystemExit('contract evidence crossed exact project identity')
                  if evidence.get('settlement_proven'):
                      raise SystemExit('contract announcement was treated as settlement')
              if record.get('promotion_allowed'):
                  if record.get('lifecycle_stage') != 'SETTLEMENT_PROVEN':
                      raise SystemExit('PAID promotion allowed before settlement proof')
                  if not record.get('payer_actor') or not record.get('settled_amount_rmb'):
                      raise SystemExit('PAID promotion allowed without payer/settled amount')

          blocker_signals = {
              blocker['signal_id']: blocker for blocker in data['signals']['blockers']
          }
          for record in data['records']:
              blocker_signal_id = record.get('blocker_signal_id')
              if not blocker_signal_id:
                  continue
              blocker = blocker_signals.get(blocker_signal_id)
              if blocker is None:
                  raise SystemExit('record references blocker absent from canonical signals')
              scoped_need = blocker.get('need_signal_id')
              if scoped_need is not None and scoped_need != record.get('need_signal_id'):
                  raise SystemExit('transaction-scoped blocker crossed canonical need identity')

          route_records = data['route_testable_records']
          if data['route_testable_count'] != len(route_records):
              raise SystemExit('route_testable_count does not match route_testable_records')
          for record in route_records:
              if record['need_evidence_state'] not in ('PAID', 'REPEATED_PAID'):
                  raise SystemExit('ROUTE_TESTABLE without paid need evidence')
              if not record['payer']:
                  raise SystemExit('ROUTE_TESTABLE without identified payer')
              if record['resource_state'] not in ('DISCOVERED', 'OPTIONED', 'OWNED'):
                  raise SystemExit('ROUTE_TESTABLE without discovered resource')
              if record['underuse_evidence_state'] not in ('OBSERVED', 'MEASURED'):
                  raise SystemExit('ROUTE_TESTABLE without observed underuse')
              if record['blocker_evidence_state'] not in ('OBSERVED', 'MEASURED'):
                  raise SystemExit('ROUTE_TESTABLE without observed blocker')

          for resource in data['signals']['resources']:
              if resource['signal_id'].startswith('LIVE_PROVIDER::'):
                  if resource['resource_state'] != 'DISCOVERED':
                      raise SystemExit('historical award provider promoted beyond DISCOVERED')
                  if resource['underuse_evidence_state'] != 'UNKNOWN':
                      raise SystemExit('historical award provider manufactured underuse')

          pair_count = data['status_counts'].get('PAIR_HYPOTHESIS', 0)
          if queue['pair_hypothesis_count'] != pair_count or queue['queued_pair_count'] != pair_count:
              raise SystemExit('validation queue pair count does not match canonical ledger')
          allowed_targets = {'PAYER_IDENTITY','PAID_NEED','RESOURCE_UNDERUSE','TRANSACTION_BLOCKER'}
          record_index = {record['record_id']: record for record in data['records']}
          resource_index = {
              resource['signal_id']: resource for resource in data['signals']['resources']
          }
          expected_capacity_basis = {
              'PROVIDER_STATED_SPARE_CAPACITY': 'CLAIMED',
              'AUTHORIZED_CAPACITY_SCHEDULE': 'OBSERVED',
              'VERIFIED_UNUSED_CAPACITY_RECORD': 'OBSERVED',
              'MEASURED_UTILIZATION_RECORD': 'MEASURED',
          }
          for task in queue['tasks']:
              if task['target_gate'] not in allowed_targets:
                  raise SystemExit('validation queue contains non-canonical target')
              if task['state_effect'] != 'NONE_UNTIL_NEW_EVIDENCE_IS_INGESTED':
                  raise SystemExit('validation planning task attempted to mutate truth state')
              if task['target_gate'] == 'RESOURCE_UNDERUSE':
                  capture = task.get('evidence_capture') or {}
                  if capture.get('ingestion_flag') != '--provider-capacity-json':
                      raise SystemExit('RESOURCE_UNDERUSE task lacks canonical capacity ingestion path')
                  if capture.get('promotion_policy') != 'EXACT_RESOURCE_SIGNAL_AND_IDENTITY_ONLY':
                      raise SystemExit('RESOURCE_UNDERUSE task relaxed exact resource identity')
                  if capture.get('accepted_basis_state') != expected_capacity_basis:
                      raise SystemExit('RESOURCE_UNDERUSE evidence basis/state policy drifted')
                  record = record_index.get(task['record_id'])
                  if record is None:
                      raise SystemExit('RESOURCE_UNDERUSE task references missing pair record')
                  resource = resource_index.get(record.get('resource_signal_id'))
                  if resource is None:
                      raise SystemExit('RESOURCE_UNDERUSE task references missing resource signal')
                  identity = capture.get('required_identity') or {}
                  expected_identity = {
                      'resource_signal_id': resource['signal_id'],
                      'provider_actor': resource['provider_actor'],
                      'capability_key': record['capability_key'],
                      'geography': record['geography'],
                  }
                  if identity != expected_identity:
                      raise SystemExit('RESOURCE_UNDERUSE capture contract crossed resource identity')
                  required_fields = set(capture.get('required_fields') or [])
                  if not {
                      'evidence_id','resource_signal_id','provider_actor','capability_key',
                      'geography','underuse_evidence_state','evidence_basis',
                      'observation_period','source_refs'
                  }.issubset(required_fields):
                      raise SystemExit('RESOURCE_UNDERUSE capture contract lacks required evidence fields')
                  if 'available_units' not in set(
                      capture.get('observed_or_measured_additional_required_fields') or []
                  ):
                      raise SystemExit('RESOURCE_UNDERUSE OBSERVED/MEASURED contract lacks available_units')
          if pair_count and queue['task_count'] == 0:
              raise SystemExit('PAIR_HYPOTHESIS exists but validation queue has no evidence tasks')

          print('canonical promotion gates preserved')
          PY

      - name: Upload live evidence and imbalance ledger
        uses: actions/upload-artifact@v4
        with:
          name: xuzhou-resource-imbalance-ledger
          path: .local/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
