name: money-flow-snapshot-live

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"
  pull_request:
    paths:
      - "src/html_ingest.py"
      - "src/money_flow_snapshot.py"
      - "src/gacc_trade_flow.py"
      - "src/gacc_trade_corroboration.py"
      - "src/pbc_money_flow.py"
      - "src/pbc_regional_financing.py"
      - "src/pbc_jiangsu_credit.py"
      - "src/jiangsu_money_flow.py"
      - "src/regional_adapters.py"
      - "src/xuzhou_construction_capex.py"
      - "src/xuzhou_enterprise_funding_demand.py"
      - "scripts/collect_money_flow_snapshot.py"
      - "scripts/collect_xuzhou_enterprise_funding_demand.py"
      - "tests/test_html_ingest.py"
      - "tests/test_money_flow_snapshot.py"
      - "tests/test_xuzhou_enterprise_funding_demand.py"
      - "requirements-pbc-js-credit.txt"
      - ".github/workflows/money-flow-snapshot-live.yml"
  push:
    paths:
      - "src/html_ingest.py"
      - "src/money_flow_snapshot.py"
      - "src/gacc_trade_flow.py"
      - "src/gacc_trade_corroboration.py"
      - "src/pbc_money_flow.py"
      - "src/pbc_regional_financing.py"
      - "src/pbc_jiangsu_credit.py"
      - "src/jiangsu_money_flow.py"
      - "src/regional_adapters.py"
      - "src/xuzhou_construction_capex.py"
      - "src/xuzhou_enterprise_funding_demand.py"
      - "scripts/collect_money_flow_snapshot.py"
      - "scripts/collect_xuzhou_enterprise_funding_demand.py"
      - "tests/test_html_ingest.py"
      - "tests/test_money_flow_snapshot.py"
      - "tests/test_xuzhou_enterprise_funding_demand.py"
      - "requirements-pbc-js-credit.txt"
      - ".github/workflows/money-flow-snapshot-live.yml"

permissions:
  contents: read

jobs:
  collect-money-flow-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated legacy XLS parser
        run: python -m pip install --disable-pip-version-check -r requirements-pbc-js-credit.txt

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect unified live money-flow snapshot
        run: |
          python scripts/collect_money_flow_snapshot.py \
            --output .local/money_flow_snapshot.json

      - name: Validate snapshot evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/money_flow_snapshot.json').read_text(encoding='utf-8'))
          if data.get('schema_version') != 'money-flow-snapshot-v3':
              raise SystemExit(f'unexpected schema: {data.get("schema_version")}')
          if data.get('geography_path') != ['China', 'Jiangsu', 'Xuzhou']:
              raise SystemExit(f'unexpected geography path: {data.get("geography_path")}')

          required_boundaries = {
              'MISSING_STAYS_UNKNOWN',
              'SOURCE_ERROR_NEVER_BECOMES_PASS',
              'NO_CROSS_SOURCE_SUM',
              'NO_TENDER_SUM_WITHOUT_PROJECT_DEDUP',
              'TENDER_NOTICE_IS_NOT_COMPLETED_PAYMENT',
              'PROCUREMENT_NOTICE_IS_NOT_COMPLETED_PAYMENT',
              'CUSTOMS_PLAINTEXT_HTTP_REQUIRES_CORROBORATION',
              'CUSTOMS_CROSS_CURRENCY_VALUES_NOT_DIRECTLY_COMPARABLE',
              'XUZHOU_SPECIFIC_AREA_TRADE_IS_NOT_CITY_TOTAL',
              'PROVINCE_CORROBORATION_DOES_NOT_CORROBORATE_XUZHOU_SPECIFIC_AREA_VALUES',
              'SCOPED_ENTERPRISE_FUNDING_DEMAND_IS_NOT_CITYWIDE_TOTAL',
              'SME_IS_NOT_PRIVATE_ENTERPRISE',
              'NO_CROSS_PROGRAM_FINANCING_DEMAND_SUM',
              'NO_CROSS_PERIOD_FINANCING_DEMAND_SUM',
              'DIRECT_FUNDING_DEMAND_EVIDENCE_PROVES_NEED_ONLY',
              'NO_OPPORTUNITY_INFERENCE',
          }
          missing_boundaries = sorted(required_boundaries - set(data.get('truth_boundaries', [])))
          if missing_boundaries:
              raise SystemExit(f'missing truth boundaries: {missing_boundaries}')

          required_feeds = {
              'china_pbc_financial_statistics',
              'jiangsu_pbc_regional_social_financing',
              'jiangsu_pbc_credit_deposit',
              'jiangsu_stats_economic_operation',
              'jiangsu_customs_trade_flow',
              'xuzhou_government_procurement',
              'xuzhou_construction_tenders',
              'xuzhou_scoped_enterprise_funding_demand',
          }
          feeds = data.get('feeds', {})
          if set(feeds) != required_feeds:
              raise SystemExit(f'unexpected feed keys: {sorted(feeds)}')
          bad = {
              key: {'status': feed.get('status'), 'error': feed.get('error')}
              for key, feed in feeds.items()
              if feed.get('status') != 'AVAILABLE'
          }
          if bad:
              raise SystemExit(f'live snapshot has unavailable feeds: {bad}')
          expected_counts = {'AVAILABLE': 8, 'UNAVAILABLE': 0, 'ERROR': 0, 'NOT_RUN': 0}
          if data.get('status_counts') != expected_counts:
              raise SystemExit(f'unexpected status counts: {data.get("status_counts")}')

          answerability = data['answerability']
          for key in ('china_money_flow', 'jiangsu_money_flow', 'jiangsu_trade_flow', 'xuzhou_institutional_spend'):
              if answerability[key]['status'] != 'AVAILABLE':
                  raise SystemExit(f'{key} is not AVAILABLE: {answerability[key]}')
          if answerability['xuzhou_specific_area_trade']['status'] != 'PARTIAL':
              raise SystemExit(f'Xuzhou specific-area trade must remain PARTIAL: {answerability["xuzhou_specific_area_trade"]}')
          if answerability['xuzhou_enterprise_funding_demand']['status'] != 'PARTIAL':
              raise SystemExit(f'Xuzhou enterprise funding demand must remain scoped PARTIAL: {answerability["xuzhou_enterprise_funding_demand"]}')
          for key in ('xuzhou_city_trade_flow', 'xuzhou_financial_balance'):
              if answerability[key]['status'] != 'UNKNOWN':
                  raise SystemExit(f'{key} must remain UNKNOWN: {answerability[key]}')
          # A newly discovered explicit private-enterprise event changes semantics and
          # must be reviewed rather than silently promoting this dimension.
          if answerability['xuzhou_private_enterprise_funding_demand']['status'] != 'UNKNOWN':
              raise SystemExit(
                  'new explicit private-enterprise funding-demand evidence requires semantic review: '
                  + json.dumps(answerability['xuzhou_private_enterprise_funding_demand'], ensure_ascii=False)
              )

          headline = data['headline_evidence']
          national_metrics = headline['China']['pbc_release'].get('metrics', {})
          if not {'social_financing_stock', 'm2_balance', 'm1_balance'} <= set(national_metrics):
              raise SystemExit(f'national PBC headline incomplete: {sorted(national_metrics)}')

          js = headline['Jiangsu']
          regional = js['regional_social_financing']['observation']
          if regional.get('region') != '江苏' or regional.get('social_financing_flow_100m_cny') is None:
              raise SystemExit(f'Jiangsu regional AFRE missing: {regional}')
          credit_metrics = js['credit_deposit'].get('metrics', {})
          for key in ('total_deposits_100m_cny', 'total_loans_100m_cny'):
              if credit_metrics.get(key) is None:
                  raise SystemExit(f'Jiangsu credit metric missing: {key}')
          if not js['economic_operation'].get('metrics'):
              raise SystemExit('Jiangsu economic-operation metrics missing')

          customs = js['customs_trade_flow']
          if customs.get('transport_security') != 'PLAINTEXT_HTTP':
              raise SystemExit(f'customs transport trust boundary missing: {customs}')
          if customs.get('corroboration_status') != 'PERIOD_IDENTITY_DIRECTION_CORROBORATED':
              raise SystemExit(f'Jiangsu customs trade is not same-period corroborated: {customs}')
          corr = customs.get('corroboration') or {}
          if corr.get('basis') != 'PERIOD_IDENTITY_DIRECTION_ONLY':
              raise SystemExit(f'unsafe customs corroboration basis: {corr}')
          if corr.get('monetary_value_comparison') != 'UNAVAILABLE_CROSS_CURRENCY':
              raise SystemExit(f'cross-currency values treated as directly comparable: {corr}')
          js_trade = customs.get('importer_exporter_location') or {}
          if js_trade.get('name', '').strip().lower() not in {'jiangsu', 'jiangsu province'}:
              raise SystemExit(f'unexpected Jiangsu customs identity: {js_trade}')
          if js_trade.get('total_ytd_usd_thousand') is None:
              raise SystemExit(f'Jiangsu customs YTD trade missing: {js_trade}')

          xz = headline['Xuzhou']
          xz_customs = xz['customs_specific_areas']
          if xz_customs.get('scope') != 'SPECIFIC_AREAS_ONLY':
              raise SystemExit(f'Xuzhou customs scope widened unexpectedly: {xz_customs}')
          if xz_customs.get('specific_area_value_corroboration') != 'NOT_ESTABLISHED':
              raise SystemExit(f'Xuzhou specific-area values were over-corroborated: {xz_customs}')
          if xz_customs.get('city_location_row') is not None:
              raise SystemExit(f'current GACC table 8 unexpectedly gained a Xuzhou city row; review scope before promotion: {xz_customs}')
          areas = xz_customs.get('areas') or []
          if not areas or any('xuzhou' not in str(row.get('name', '')).lower() for row in areas):
              raise SystemExit(f'Xuzhou specific-area trade evidence missing/invalid: {areas}')

          procurement = xz['government_procurement']
          construction = xz['construction_tenders']
          if (procurement.get('parsed_events') or 0) < 5:
              raise SystemExit(f'too few Xuzhou procurement events: {procurement}')
          if (construction.get('parsed_events') or 0) < 5:
              raise SystemExit(f'too few Xuzhou construction events: {construction}')
          if (construction.get('amount_evidence_count') or 0) < 3:
              raise SystemExit(f'too few Xuzhou construction amount observations: {construction}')
          if 'NO_SUM_WITHOUT_PROJECT_DEDUP' not in str(construction.get('aggregation_policy')):
              raise SystemExit('Xuzhou construction anti-double-count policy missing')

          funding = xz['enterprise_financing_demand']
          if funding.get('evidence_kind') != 'SCOPED_DIRECT_ENTERPRISE_FINANCING_DEMAND':
              raise SystemExit(f'funding-demand identity drift: {funding}')
          if (funding.get('event_count') or 0) < 1:
              raise SystemExit(f'no scoped funding-demand event: {funding}')
          if funding.get('aggregation_policy') != 'NO_CROSS_PROGRAM_OR_PERIOD_SUM':
              raise SystemExit(f'unsafe funding-demand aggregation policy: {funding}')
          funding_events = funding.get('events') or []
          if len(funding_events) != funding.get('event_count'):
              raise SystemExit(f'funding event count mismatch: {funding}')
          for event in funding_events:
              parsed = urlparse(event.get('source_url', ''))
              if parsed.scheme != 'https' or parsed.hostname != 'www.jiangsu.gov.cn' or '/art_' not in parsed.path:
                  raise SystemExit(f'funding source escaped official allowlist: {event}')
              if event.get('source_authority') != '徐州市政府办公室':
                  raise SystemExit(f'funding authority drift: {event}')
              if event.get('coverage_scope') != 'SCOPED_PROGRAM_OR_REPORTED_BATCH':
                  raise SystemExit(f'funding scope widened unexpectedly: {event}')
              if not event.get('demand_amount_cny_100m'):
                  raise SystemExit(f'explicit demand amount missing: {event}')
              if event.get('aggregation_allowed') is not False:
                  raise SystemExit(f'scoped funding-demand event became summable: {event}')
              if event.get('actor_scope') == 'PRIVATE_ENTERPRISE' or event.get('private_enterprise_scope_explicit') is True:
                  raise SystemExit('new private-enterprise funding-demand evidence requires semantic review: ' + json.dumps(event, ensure_ascii=False))
              if event.get('private_enterprise_scope_explicit') is not False:
                  raise SystemExit(f'private-enterprise inference leaked: {event}')

          serialized = json.dumps(headline, ensure_ascii=False)
          for forbidden in (
              'total_contract_estimate_rmb',
              'total_budget_rmb',
              'total_demand_amount_cny_100m',
              'money_flow_score',
              'opportunity_score',
              'xuzhou_trade_total',
              'specific_area_total',
          ):
              if forbidden in serialized:
                  raise SystemExit(f'unsafe aggregate/score leaked into headline evidence: {forbidden}')

          if 'NEED + SURPLUS RESOURCE + TRANSACTION BLOCKER' not in data.get('interpretation_boundary', ''):
              raise SystemExit('opportunity promotion boundary missing')

          print('status_counts=', json.dumps(data['status_counts'], sort_keys=True))
          print('answerability=', json.dumps(answerability, ensure_ascii=False, sort_keys=True))
          print('national_release=', headline['China']['pbc_release']['title'])
          print('jiangsu_regional_afre=', json.dumps(regional, ensure_ascii=False, sort_keys=True))
          print('jiangsu_credit=', json.dumps(credit_metrics, ensure_ascii=False, sort_keys=True))
          print('jiangsu_customs_trade=', json.dumps(customs, ensure_ascii=False, sort_keys=True))
          print('xuzhou_customs_specific_areas=', json.dumps(xz_customs, ensure_ascii=False, sort_keys=True))
          print('xuzhou_procurement_events=', procurement['parsed_events'])
          print('xuzhou_construction_events=', construction['parsed_events'])
          print('xuzhou_construction_amount_evidence=', construction['amount_evidence_count'])
          print('xuzhou_enterprise_funding_demand=', json.dumps(funding, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload money-flow snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-snapshot
          path: .local/money_flow_snapshot.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
