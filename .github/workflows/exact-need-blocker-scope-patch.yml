name: exact-need-blocker-scope-patch

on:
  push:
    paths:
      - ".github/workflows/exact-need-blocker-scope-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/exact-need-blocker-scope
      - name: Preserve blocker need scope through lifecycle reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/procurement_lifecycle.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _blocker_from_dict(item: Mapping[str, Any]) -> BlockerSignal:\n    return BlockerSignal(\n        signal_id=str(item["signal_id"]),\n        capability_key=str(item["capability_key"]),\n        geography=str(item["geography"]),\n        blocker_type=str(item["blocker_type"]),\n        evidence_state=str(item["evidence_state"]),\n        description=str(item["description"]),\n        source_ids=tuple(item.get("source_ids") or ()),\n    )\n'''
          new = '''def _blocker_from_dict(item: Mapping[str, Any]) -> BlockerSignal:\n    return BlockerSignal(\n        signal_id=str(item["signal_id"]),\n        capability_key=str(item["capability_key"]),\n        geography=str(item["geography"]),\n        blocker_type=str(item["blocker_type"]),\n        evidence_state=str(item["evidence_state"]),\n        description=str(item["description"]),\n        source_ids=tuple(item.get("source_ids") or ()),\n        need_signal_id=_text(item.get("need_signal_id")),\n    )\n'''
          if old not in text:
              raise SystemExit('expected lifecycle blocker reconstruction snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/procurement_lifecycle.py
          git config user.name "wanggen"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add src/procurement_lifecycle.py
          git commit -m "Preserve blocker scope across lifecycle integration"
          git push origin HEAD:codex/exact-need-blocker-scope
