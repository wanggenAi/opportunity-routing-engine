name: mofcom-open-data-live

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * *"
  push:
    paths:
      - "src/mofcom_open_data.py"
      - "src/network_ingest.py"
      - "scripts/collect_mofcom_open_data.py"
      - "data/mofcom_api_watchlist.csv"
      - ".github/workflows/mofcom-open-data-live.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect free official MOFCOM API data
        run: |
          python scripts/collect_mofcom_open_data.py \
            --watchlist data/mofcom_api_watchlist.csv \
            --output .local/mofcom_open_data.json

      - name: Upload MOFCOM evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mofcom-open-data-evidence
          path: .local/mofcom_open_data.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Validate provenance and truth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.local/mofcom_open_data.json').read_text(encoding='utf-8'))
          print('errors:', json.dumps(data['errors'], ensure_ascii=False))
          if data['success_count'] < 1:
              raise SystemExit('no successful MOFCOM API response')
          for item in data['datasets']:
              if item['api_status'] != 1:
                  raise SystemExit('status!=1 must not enter successful datasets')
              provenance = item['provenance']
              if not provenance.get('payload_sha256'):
                  raise SystemExit('missing provenance hash')
              if not str(provenance.get('url', '')).startswith('https://opendata.mofcom.gov.cn/'):
                  raise SystemExit('unexpected MOFCOM API host/scheme')
              print(item['dataset']['name'], item['data_type'], item['top_level_item_count'])
          PY
