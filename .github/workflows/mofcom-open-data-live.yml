name: mofcom-open-data-live

on:
  workflow_dispatch:
  schedule:
    - cron: "35 2 * * *"
  push:
    paths:
      - "src/mofcom_open_data.py"
      - "src/network_ingest.py"
      - "scripts/collect_mofcom_open_data.py"
      - "data/mofcom_api_watchlist.csv"
      - ".github/workflows/mofcom-open-data-live.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect free official MOFCOM API data
        run: |
          python scripts/collect_mofcom_open_data.py \
            --watchlist data/mofcom_api_watchlist.csv \
            --output .local/mofcom_open_data.json

      - name: Upload MOFCOM evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mofcom-open-data-evidence
          path: .local/mofcom_open_data.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Validate provenance and actual data availability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/mofcom_open_data.json').read_text(encoding='utf-8'))
          print('errors:', json.dumps(data['errors'], ensure_ascii=False))
          print(
              'responses=', data['response_count'],
              'available=', data['available_count'],
              'unavailable=', data['unavailable_count'],
          )
          if data['response_count'] < 1:
              raise SystemExit('no successful MOFCOM API transport response')
          for item in data['datasets']:
              if item['api_status'] != 1:
                  raise SystemExit('status!=1 must not enter successful transport responses')
              provenance = item['provenance']
              if not provenance.get('payload_sha256'):
                  raise SystemExit('missing provenance hash')
              parsed = urlparse(str(provenance.get('url', '')))
              if parsed.hostname != 'opendata.mofcom.gov.cn' or parsed.path != '/front/data/jsonData':
                  raise SystemExit('unexpected MOFCOM API host/path')
              if parsed.scheme not in {'http', 'https'}:
                  raise SystemExit('unexpected MOFCOM API scheme')
              if item['transport_security'] == 'PLAINTEXT_HTTP':
                  if parsed.scheme != 'http' or item['corroboration_required'] is not True:
                      raise SystemExit('plain HTTP evidence must remain explicitly lower-trust')
              elif item['transport_security'] == 'HTTPS':
                  if parsed.scheme != 'https':
                      raise SystemExit('HTTPS state must match final provenance URL')
              else:
                  raise SystemExit('unknown transport security state')
              print(
                  item['dataset']['name'],
                  'available=', item['data_available'],
                  item['data_type'],
                  item['top_level_item_count'],
                  item['transport_security'],
              )
          if data['available_count'] < 1:
              raise SystemExit(
                  'MOFCOM endpoint is reachable but enabled datasets returned no non-blank data'
              )
          PY
