name: broad-discovery-run-003-observation-review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/research_control_plane.py"
      - "src/research_execution_capture.py"
      - "src/research_observation_bridge.py"
      - "src/emergent_taxonomy.py"
      - "src/observed_patterns.py"
      - "scripts/build_broad_discovery_observation_review.py"
      - "tests/test_broad_discovery_run_003_observation_review.py"
      - "data/research_missions/china_primary_broad_discovery.json"
      - "data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/**"
      - ".github/workflows/broad-discovery-run-003-observation-review.yml"

permissions:
  contents: read

concurrency:
  group: broad-discovery-run-003-observation-review
  cancel-in-progress: false

jobs:
  validate-observation-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Build reviewed observation and alignment state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          python scripts/build_broad_discovery_observation_review.py \
            --mission data/research_missions/china_primary_broad_discovery.json \
            --dynamic-terms data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/dynamic_terms.json \
            --captures data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/captures.json \
            --reviewed-dir data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/reviewed \
            --alignments data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/concept_alignments_reviewed.json \
            --summary-output .local/broad_discovery_run_003_observation_review.json \
            --observations-output .local/broad_discovery_run_003_reviewed_observations.json

      - name: Require conservative observation and taxonomy boundaries
        shell: bash
        run: |
          set -euo pipefail
          summary=.local/broad_discovery_run_003_observation_review.json
          observations=.local/broad_discovery_run_003_reviewed_observations.json

          test "$(jq -r '.research_evidence_count' "$summary")" = "30"
          test "$(jq -r '.reviewed_observation_count' "$summary")" = "18"
          test "$(jq -r '.alignment_count' "$summary")" = "5"
          test "$(jq -r '.alignment_state_counts.CANDIDATE' "$summary")" = "3"
          test "$(jq -r '.alignment_state_counts.PROMOTION_REVIEW_READY' "$summary")" = "2"
          test "$(jq -r '.promotion_review_ready_count' "$summary")" = "2"
          test "$(jq -r '.exact_observed_pattern_count' "$summary")" = "0"
          test "$(jq -r '.taxonomy_promotion' "$summary")" = "NOT_PROMOTED"
          test "$(jq -r '.business_promotion' "$summary")" = "NOT_PROMOTED"
          test "$(jq -r '.business_promotion' "$observations")" = "NOT_PROMOTED"

          jq -e '[.assessments[] | select(.state == "PROMOTION_REVIEW_READY") | .candidate_concept] | sort == ["PLATFORM_TRUST_AND_GOVERNANCE_INFRASTRUCTURE","SKILL_TO_WORK_MATCHING_INFRASTRUCTURE"]' "$summary" >/dev/null
          jq -e '[.assessments[] | select(.state == "CANDIDATE") | .candidate_concept] | sort == ["CIRCULAR_RECOMMERCE_INFRASTRUCTURE","LOGISTICS_CAPACITY_ORCHESTRATION","PET_SERVICE_ECOSYSTEM_FORMALIZATION"]' "$summary" >/dev/null
          jq -e '[.assessments[] | select(.state == "PROMOTION_REVIEW_READY") | (.observation_count == 4 and .source_count == 4 and .actor_count >= 4 and .period_count >= 4 and .taxonomy_promotion == "NOT_PROMOTED" and .business_promotion == "NOT_PROMOTED")] | all' "$summary" >/dev/null
          jq -e '.truth_boundaries | index("SUBSIDIZED_FLOW_NE_ORGANIC_DEMAND") != null and index("MARKET_VACANCY_NE_CALLABLE_SPARE_CAPACITY") != null and index("PLATFORM_GOVERNANCE_NE_MERCHANT_PAIN_OR_WILLINGNESS_TO_PAY") != null' "$summary" >/dev/null
          jq -e '.observations[] | select(.observation_id == "bd003-obs-xz-subsidy-leverage-202606") | (.unknown_fields | index("FISCAL_LEVERAGE_NE_COUNTERFACTUAL_ORGANIC_DEMAND") != null)' "$observations" >/dev/null
          jq -e '.observations[] | select(.observation_id == "bd003-obs-cn-pet-service-use-2025") | .captured_payload.medical_share_direction_vs_2024 == "DOWN"' "$observations" >/dev/null
          jq -e '.observations[] | select(.observation_id == "bd003-obs-cn-logistics-q2-202606") | .captured_payload.average_vacancy_pct == 18.5 and .captured_payload.net_absorption_qoq_pct == 119.6 and (.unknown_fields | index("MARKET_VACANCY_NE_CALLABLE_SPARE_CAPACITY") != null)' "$observations" >/dev/null

          if jq -e '.. | objects | has("payer") or has("paid_need") or has("opportunity_score") or has("commercial_score") or has("route_testable") or has("availability_confirmed") or has("permission_allowed")' "$summary" "$observations" >/dev/null; then
            echo "Commercial or route truth leaked into observation review" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Broad Discovery Run 003 — Observation Review"
            echo
            jq -r '"- research evidence: `\(.research_evidence_count)`"' .local/broad_discovery_run_003_observation_review.json
            jq -r '"- reviewed observations: `\(.reviewed_observation_count)`"' .local/broad_discovery_run_003_observation_review.json
            jq -r '"- reviewed alignments: `\(.alignment_count)`"' .local/broad_discovery_run_003_observation_review.json
            jq -r '"- states: `\(.alignment_state_counts)`"' .local/broad_discovery_run_003_observation_review.json
            jq -r '"- exact source-native ObservedPatterns: `\(.exact_observed_pattern_count)`"' .local/broad_discovery_run_003_observation_review.json
            echo
            jq -r '.assessments[] | "- `\(.candidate_concept)` — `\(.state)` — observations `\(.observation_count)`, sources `\(.source_count)`, actors `\(.actor_count)`, periods `\(.period_count)`"' .local/broad_discovery_run_003_observation_review.json
            echo
            echo "PROMOTION_REVIEW_READY is ontology governance only. No taxonomy node, exact ObservedPattern, payer, paid need, route or business is promoted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observation-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: broad-discovery-run-003-observation-review-state
          path: |
            .local/broad_discovery_run_003_observation_review.json
            .local/broad_discovery_run_003_reviewed_observations.json
            data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/concept_alignments_reviewed.json
            data/research_runs/BROAD_DISCOVERY_RUN_003_2026-09-14/reviewed/*.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
