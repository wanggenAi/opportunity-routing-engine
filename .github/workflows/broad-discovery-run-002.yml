name: broad-discovery-run-002

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/research_control_plane.py"
      - "src/research_execution_capture.py"
      - "scripts/build_research_mission.py"
      - "scripts/bind_research_executor_captures.py"
      - "scripts/assess_research_coverage.py"
      - "tests/test_broad_discovery_run_002.py"
      - "data/research_missions/china_primary_broad_discovery.json"
      - "data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/**"
      - ".github/workflows/broad-discovery-run-002.yml"

permissions:
  contents: read

concurrency:
  group: broad-discovery-run-002
  cancel-in-progress: false

jobs:
  validate-executed-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exact dynamic research plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local
          python scripts/build_research_mission.py \
            --mission data/research_missions/china_primary_broad_discovery.json \
            --dynamic-terms data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/dynamic_terms.json \
            --as-of-date 2026-09-14 \
            --plan-output .local/research_mission_plan.json \
            --coverage-output .local/research_coverage_empty.json

      - name: Bind executor captures to exact governed queries
        run: |
          python scripts/bind_research_executor_captures.py \
            --plan .local/research_mission_plan.json \
            --captures data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/captures.json \
            --output .local/research_evidence.json

      - name: Assess executed research coverage
        run: |
          python scripts/assess_research_coverage.py \
            --mission data/research_missions/china_primary_broad_discovery.json \
            --plan .local/research_mission_plan.json \
            --evidence .local/research_evidence.json \
            --output .local/research_coverage.json

      - name: Require broad coverage without commercial promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.state' .local/research_coverage.json)" = "BROAD_DISCOVERY_READY"
          test "$(jq -r '.broad_discovery_use_authorized' .local/research_coverage.json)" = "true"
          test "$(jq -r '.evidence_count' .local/research_coverage.json)" = "30"
          test "$(jq -r '.evidence_count' .local/research_evidence.json)" = "30"
          test "$(jq -r '.capture_schema_version' .local/research_evidence.json)" = "research-executor-capture.v1"
          test "$(jq -r '.dynamic_term_count' .local/research_mission_plan.json)" = "5"
          test "$(jq -r '.blockers | length' .local/research_coverage.json)" = "0"
          test "$(jq -r '.cautions | length' .local/research_coverage.json)" = "0"
          jq -e '[.captures[] | has("query_id")] | any | not' data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/captures.json >/dev/null
          jq -e '[.evidence[].query_id | startswith("rq-")] | all' .local/research_evidence.json >/dev/null
          jq -e '.lane_counts | keys | sort == ["CHINA_CORE","CONTRADICTION_SEARCH","GLOBAL_AUXILIARY","JIANGSU_ZOOM","SOURCE_DISCOVERY","XUZHOU_ZOOM"]' .local/research_coverage.json >/dev/null
          if jq -e '.. | objects | has("opportunity_score") or has("commercial_score") or has("route_testable") or has("core_business_candidate") or has("business_promotion") or has("payer")' .local/research_evidence.json >/dev/null; then
            echo "Commercial truth leaked into research evidence" >&2
            exit 1
          fi

      - name: Publish operator summary
        run: |
          {
            echo "# Broad Discovery Run 002"
            echo
            jq -r '"- mission: `\(.mission.mission_id)`"' .local/research_mission_plan.json
            jq -r '"- dynamic terms: `\(.dynamic_term_count)`"' .local/research_mission_plan.json
            jq -r '"- evidence: `\(.evidence_count)`"' .local/research_coverage.json
            jq -r '"- independent hosts: `\(.independent_host_count)`"' .local/research_coverage.json
            jq -r '"- source families: `\(.source_family_count)`"' .local/research_coverage.json
            jq -r '"- lane counts: `\(.lane_counts)`"' .local/research_coverage.json
            jq -r '"- coverage: `\(.state)`"' .local/research_coverage.json
            echo
            echo "This run broadens China-primary observation and preserves counterevidence. BROAD_DISCOVERY_READY is research breadth only; no Pattern, taxonomy, payer, route or business promotion is implied."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload executed research artifact
        uses: actions/upload-artifact@v4
        with:
          name: broad-discovery-run-002-state
          path: |
            .local/research_mission_plan.json
            .local/research_evidence.json
            .local/research_coverage.json
            data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/dynamic_terms.json
            data/research_runs/BROAD_DISCOVERY_RUN_002_2026-09-14/captures.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
