name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve public Xuzhou enterprise appeal constants
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page = 'https://xzsme.js.cn/home'
          req = Request(page, headers={'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)'})
          with urlopen(req, timeout=20) as r:
              html = r.read(1_000_000).decode('utf-8')
          src = re.search(r'<script[^>]+type="module"[^>]+src="([^"]+)"', html, flags=re.I)
          if not src:
              raise SystemExit('module script missing')
          asset = urljoin(page, src.group(1))
          req = Request(asset, headers={'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)'})
          with urlopen(req, timeout=20) as r:
              text = r.read(8_000_000).decode('utf-8', errors='ignore')
          print('ASSET=', asset, 'bytes=', len(text))

          needles = [
              'appeal:{Appeal:',
              'getAppealItem:',
              'classificationofdemands:',
              'appealProgress:',
              'appealDetails:',
              'getMyDemandList:',
              'baseURL:',
              'baseURL=',
              'NetworkHandler.GET(Apib.appeal.Appeal',
          ]
          for needle in needles:
              print('CONTEXT_FOR', repr(needle))
              start = 0
              hits = 0
              while hits < 8:
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  print(text[max(0, i-600):min(len(text), i+1200)])
                  print('---')
                  hits += 1
                  start = i + len(needle)
              print('HITS=', hits)

          # Enumerate absolute API-like URLs literally embedded in the public bundle.
          urls = []
          for m in re.finditer(r'https?://[^"\'`\\\s]{5,300}', text):
              u = m.group(0)
              if any(k in u.lower() for k in ('xzsme', 'api', 'service', 'appeal')):
                  urls.append(u)
          print('PUBLIC_ABSOLUTE_URLS=', list(dict.fromkeys(urls))[:200])
          PY
