name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe anonymous public appeal feed used by homepage
        run: |
          python - <<'PY'
          import hashlib, json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = 'https://xzsme.js.cn/xzapi/models/ebDemands/queryElasticsearch'
          url = base + '?' + urlencode({'pageSize': 100, 'pageNo': 1})
          req = Request(url, headers={
              'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)',
              'Accept': 'application/json,text/plain,*/*',
          })
          with urlopen(req, timeout=20) as r:
              raw = r.read(5_000_000)
              print('status=', r.status, 'final=', r.geturl(), 'type=', r.headers.get('Content-Type'), 'bytes=', len(raw), 'sha256=', hashlib.sha256(raw).hexdigest())
          data = json.loads(raw.decode('utf-8'))
          print('TOP_LEVEL=', {k: v for k, v in data.items() if k not in {'result', 'data'}})
          result = data.get('result') or {}
          records = result.get('records') or []
          print('RESULT_KEYS=', sorted(result.keys()))
          print('RECORD_COUNT=', len(records), 'TOTAL=', result.get('total'))
          if records:
              print('RECORD_KEYS=', sorted(records[0].keys()))

          finance_terms = ('融资', '贷款', '资金周转', '资金短缺', '续贷', '融资难', '融资贵', '银行贷款')
          matches = []
          for rec in records:
              # Print only already-public appeal fields, excluding contact/person-like fields.
              title = str(rec.get('title') or '')
              content = str(rec.get('content') or '')
              hay = title + ' ' + content
              if any(term in hay for term in finance_terms):
                  safe = {
                      'id': rec.get('id'),
                      'title': title,
                      'content': content,
                      'questionType': rec.get('questionType'),
                      'demandsAddress': rec.get('demandsAddress'),
                      'createTime': rec.get('createTime'),
                      'updateTime': rec.get('updateTime'),
                      'status': rec.get('status'),
                      'source': rec.get('source'),
                  }
                  matches.append(safe)
          print('FINANCE_MATCH_COUNT=', len(matches))
          for item in matches[:30]:
              print('FINANCE_MATCH=', json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
