name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public Xuzhou enterprise SPA shell
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          url = 'https://xzsme.js.cn/home'
          req = Request(url, headers={
              'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)',
              'Accept': 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.5',
          })
          with urlopen(req, timeout=20) as r:
              raw = r.read(1_000_000)
              html = raw.decode('utf-8')
              print('status=', r.status, 'final=', r.geturl(), 'type=', r.headers.get('Content-Type'), 'bytes=', len(raw))
              print('RAW_HTML_BEGIN')
              print(html)
              print('RAW_HTML_END')

          assets = []
          for pattern in (r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+)'):
              for value in re.findall(pattern, html, flags=re.I):
                  absolute = urljoin(url, value)
                  if urlparse(absolute).hostname in {'xzsme.js.cn', 'www.xzsme.js.cn'}:
                      assets.append(absolute)
          print('SAME_HOST_ASSETS=', list(dict.fromkeys(assets)))

          # Public static JS is inspected only for literal endpoint/path strings.
          # We do not call authenticated endpoints, bypass login, or emulate private APIs.
          for asset in list(dict.fromkeys(assets)):
              if not asset.split('?', 1)[0].lower().endswith('.js'):
                  continue
              req = Request(asset, headers={'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)'})
              with urlopen(req, timeout=20) as r:
                  body = r.read(8_000_000)
                  print('ASSET', asset, 'status=', r.status, 'bytes=', len(body), 'type=', r.headers.get('Content-Type'))
                  text = body.decode('utf-8', errors='ignore')
                  candidates = []
                  for m in re.finditer(r'["\']([^"\']{3,240})["\']', text):
                      s = m.group(1)
                      low = s.lower()
                      if ('诉求' in s or any(k in low for k in ('appeal', 'demand', 'request', 'service110', 'typical', 'finance', 'loan'))):
                          candidates.append(s)
                  print('PUBLIC_LITERAL_HINTS=', list(dict.fromkeys(candidates))[:200])
          PY
