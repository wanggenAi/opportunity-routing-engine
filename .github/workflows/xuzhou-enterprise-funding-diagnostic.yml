name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay public area to appeal homepage chain
        run: |
          python - <<'PY'
          import hashlib, json, re
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          origin = 'https://xzsme.js.cn'
          home = origin + '/home'
          common = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          }

          # Resolve endpoint constants from the same public JS bundle used by the homepage.
          req = Request(home, headers={**common, 'Accept': 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.5'})
          with urlopen(req, timeout=20) as r:
              html = r.read(1_000_000).decode('utf-8')
          src = re.search(r'<script[^>]+type="module"[^>]+src="([^"]+)"', html, flags=re.I)
          if not src:
              raise SystemExit('module script missing')
          asset = urljoin(home, src.group(1))
          req = Request(asset, headers=common)
          with urlopen(req, timeout=20) as r:
              bundle = r.read(8_000_000).decode('utf-8', errors='ignore')

          area_match = re.search(r'getAllList:"([^"]+)"', bundle)
          appeal_match = re.search(r'appeal:\{Appeal:"([^"]+)"', bundle)
          base_match = re.search(r'VITE_BASEURL:"([^"]+)"', bundle)
          if not (area_match and appeal_match and base_match):
              raise SystemExit('public homepage endpoint constants missing')
          api_base = base_match.group(1)
          area_url = urljoin(api_base, area_match.group(1))
          appeal_url = urljoin(api_base, appeal_match.group(1))
          if not area_url.startswith(origin + '/xzapi/') or not appeal_url.startswith(origin + '/xzapi/'):
              raise SystemExit('endpoint escaped official public API base')
          print('PUBLIC_AREA_ENDPOINT=', area_url)
          print('PUBLIC_APPEAL_ENDPOINT=', appeal_url)

          xhr_headers = {
              **common,
              'Accept': 'application/json,text/plain,*/*',
              'Referer': home,
              'Origin': origin,
          }
          req = Request(area_url, headers=xhr_headers)
          with urlopen(req, timeout=20) as r:
              area_raw = r.read(2_000_000)
              print('AREA_HTTP=', r.status, 'type=', r.headers.get('Content-Type'), 'bytes=', len(area_raw), 'sha256=', hashlib.sha256(area_raw).hexdigest())
          area_data = json.loads(area_raw.decode('utf-8'))
          print('AREA_TOP_LEVEL=', {k: v for k, v in area_data.items() if k != 'result'})
          areas = area_data.get('result') or []
          if area_data.get('code') != 200 or not isinstance(areas, list) or not areas:
              raise SystemExit('public homepage area feed unavailable')
          safe_areas = [{'id': row.get('id'), 'chrName': row.get('chrName')} for row in areas[:30]]
          print('PUBLIC_AREAS=', json.dumps(safe_areas, ensure_ascii=False))

          # The public UI explicitly overwrites result[0].chrName to 徐州市 and stores result[0].id as araeid.
          city_id = areas[0].get('id')
          if city_id in (None, ''):
              raise SystemExit('public homepage first area has no id')
          print('HOMEPAGE_DEFAULT_XUZHOU_ID=', city_id)

          params = {'pageSize': 100, 'pageNo': 1, 'demandsAddress': city_id}
          req = Request(appeal_url + '?' + urlencode(params), headers=xhr_headers)
          with urlopen(req, timeout=20) as r:
              raw = r.read(5_000_000)
              print('APPEAL_HTTP=', r.status, 'type=', r.headers.get('Content-Type'), 'bytes=', len(raw), 'sha256=', hashlib.sha256(raw).hexdigest())
          data = json.loads(raw.decode('utf-8'))
          print('APPEAL_TOP_LEVEL=', {k: v for k, v in data.items() if k != 'result'})
          result = data.get('result') or {}
          records = result.get('records') or []
          print('APPEAL_RESULT_KEYS=', sorted(result.keys()))
          print('APPEAL_RECORD_COUNT=', len(records), 'TOTAL=', result.get('total'))
          if data.get('code') != 200 or data.get('success') is not True:
              raise SystemExit('public Xuzhou appeal feed is not application-successful')
          if records:
              print('PUBLIC_RECORD_KEYS=', sorted(records[0].keys()))

          finance_terms = ('融资', '贷款', '资金周转', '资金短缺', '续贷', '融资难', '融资贵', '银行贷款')
          matches = []
          for rec in records:
              title = str(rec.get('title') or '')
              content = str(rec.get('content') or '')
              if not any(term in title + ' ' + content for term in finance_terms):
                  continue
              matches.append({
                  'id': rec.get('id'),
                  'title': title,
                  'content': content,
                  'questionType': rec.get('questionType'),
                  'demandsAddress': rec.get('demandsAddress'),
                  'createTime': rec.get('createTime'),
                  'updateTime': rec.get('updateTime'),
                  'status': rec.get('status'),
                  'source': rec.get('source'),
              })
          print('FINANCE_MATCH_COUNT=', len(matches))
          for item in matches[:30]:
              print('FINANCE_MATCH=', json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
