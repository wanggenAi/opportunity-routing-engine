name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bounded probe of public appeal feed by official area
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlencode, urljoin
          from urllib.request import Request, urlopen

          origin = 'https://xzsme.js.cn'
          home = origin + '/home'
          common = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          }
          xhr_headers = {**common, 'Accept': 'application/json,text/plain,*/*', 'Referer': home, 'Origin': origin}

          # Discover the exact public endpoints from the bundle instead of hard-coding hidden paths.
          with urlopen(Request(home, headers=common), timeout=20) as r:
              html = r.read(1_000_000).decode('utf-8')
          src = re.search(r'<script[^>]+type="module"[^>]+src="([^"]+)"', html, flags=re.I)
          if not src:
              raise SystemExit('module script missing')
          asset = urljoin(home, src.group(1))
          with urlopen(Request(asset, headers=common), timeout=20) as r:
              bundle = r.read(8_000_000).decode('utf-8', errors='ignore')
          area_match = re.search(r'getAllList:"([^"]+)"', bundle)
          appeal_match = re.search(r'appeal:\{Appeal:"([^"]+)"', bundle)
          base_match = re.search(r'VITE_BASEURL:"([^"]+)"', bundle)
          if not (area_match and appeal_match and base_match):
              raise SystemExit('public homepage endpoint constants missing')
          api_base = base_match.group(1)
          if api_base != origin + '/xzapi/':
              raise SystemExit(f'unexpected public API base: {api_base}')

          def combine_api(path):
              if '://' in path or path.startswith('//'):
                  raise SystemExit(f'absolute endpoint not allowed: {path}')
              value = api_base.rstrip('/') + '/' + path.lstrip('/')
              if not value.startswith(origin + '/xzapi/'):
                  raise SystemExit(f'endpoint escaped public API base: {value}')
              return value

          area_url = combine_api(area_match.group(1))
          appeal_url = combine_api(appeal_match.group(1))
          with urlopen(Request(area_url, headers=xhr_headers), timeout=20) as r:
              area_data = json.loads(r.read(2_000_000).decode('utf-8'))
          areas = area_data.get('result') or []
          if area_data.get('code') != 200 or not isinstance(areas, list) or not areas:
              raise SystemExit('official area list unavailable')

          results = []
          for index, row in enumerate(areas[:20]):
              area_id = row.get('id')
              area_name = '徐州市' if index == 0 else row.get('chrName')
              if area_id in (None, ''):
                  continue
              params = {'pageSize': 10, 'pageNo': 1, 'demandsAddress': area_id}
              url = appeal_url + '?' + urlencode(params)
              with urlopen(Request(url, headers=xhr_headers), timeout=20) as r:
                  raw = r.read(2_000_000)
              data = json.loads(raw.decode('utf-8'))
              result = data.get('result') or {}
              item = {
                  'area_id': str(area_id),
                  'area_name': area_name,
                  'http_application_success': data.get('success'),
                  'code': data.get('code'),
                  'message': data.get('message'),
                  'records_on_first_page': len(result.get('records') or []),
                  'total': result.get('total'),
              }
              results.append(item)
              print('AREA_APPEAL_STATUS=', json.dumps(item, ensure_ascii=False, sort_keys=True))

          usable = [x for x in results if x['http_application_success'] is True and x['code'] == 200 and (x['total'] or 0) > 0]
          successful_empty = [x for x in results if x['http_application_success'] is True and x['code'] == 200 and (x['total'] or 0) == 0]
          failed = [x for x in results if not (x['http_application_success'] is True and x['code'] == 200)]
          print('SUMMARY=', json.dumps({
              'probed': len(results),
              'usable_nonempty': len(usable),
              'successful_empty': len(successful_empty),
              'application_failed': len(failed),
              'usable_areas': [{'area_id': x['area_id'], 'area_name': x['area_name'], 'total': x['total']} for x in usable],
          }, ensure_ascii=False, sort_keys=True))
          PY
