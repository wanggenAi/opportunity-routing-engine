name: xuzhou-enterprise-funding-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/xuzhou-enterprise-funding-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace public area selection used by appeal homepage
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page = 'https://xzsme.js.cn/home'
          req = Request(page, headers={'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)'})
          with urlopen(req, timeout=20) as r:
              html = r.read(1_000_000).decode('utf-8')
          src = re.search(r'<script[^>]+type="module"[^>]+src="([^"]+)"', html, flags=re.I)
          if not src:
              raise SystemExit('module script missing')
          asset = urljoin(page, src.group(1))
          req = Request(asset, headers={'User-Agent': 'OpportunityRoutingEngine/0.1 (+public-evidence-ingest)'})
          with urlopen(req, timeout=20) as r:
              text = r.read(8_000_000).decode('utf-8', errors='ignore')
          print('ASSET=', asset, 'bytes=', len(text))

          for needle in ('araeid', 'demandsAddress', 'localStorage.setItem', 'localStorage.getItem'):
              print('CONTEXT_FOR', repr(needle))
              start = 0
              hits = 0
              while hits < 20:
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  context = text[max(0, i-700):min(len(text), i+1400)]
                  if needle in ('araeid', 'demandsAddress') or 'araeid' in context or 'demandsAddress' in context:
                      print(context)
                      print('---')
                  hits += 1
                  start = i + len(needle)
              print('HITS=', hits)

          # Surface only literal public endpoint constants near area/address concepts.
          literals = []
          for m in re.finditer(r'["\']([^"\']{3,220})["\']', text):
              s = m.group(1)
              low = s.lower()
              if any(k in low for k in ('area', 'region', 'district', 'address')) or any(k in s for k in ('区域', '地区', '区县', '地址', '属地')):
                  if '/' in s or 'arae' in low or 'area' in low or 'region' in low or 'district' in low:
                      literals.append(s)
          print('AREA_LITERAL_HINTS=', list(dict.fromkeys(literals))[:300])
          PY
