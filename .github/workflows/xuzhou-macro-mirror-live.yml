name: xuzhou-macro-mirror-live

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"
  pull_request:
    paths:
      - "src/xuzhou_macro_mirror.py"
      - "scripts/collect_xuzhou_macro_mirror.py"
      - "tests/test_xuzhou_macro_mirror.py"
      - "data/source_registry.csv"
      - ".github/workflows/xuzhou-macro-mirror-live.yml"
  push:
    paths:
      - "src/xuzhou_macro_mirror.py"
      - "scripts/collect_xuzhou_macro_mirror.py"
      - "tests/test_xuzhou_macro_mirror.py"
      - "data/source_registry.csv"
      - ".github/workflows/xuzhou-macro-mirror-live.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect latest verified Xuzhou macro mirror release
        run: |
          python scripts/collect_xuzhou_macro_mirror.py \
            --max-pages 35 \
            --output .local/xuzhou_macro_mirror.json

      - name: Validate Xuzhou macro evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('.local/xuzhou_macro_mirror.json').read_text(encoding='utf-8'))
          if data.get('source_id') != 'JS_GOV_XZ_MIRROR' or data.get('data_available') is not True:
              raise SystemExit('Xuzhou macro mirror did not produce available data')
          release = data['release']
          if release.get('mirror_owner') != '江苏省人民政府':
              raise SystemExit('unexpected mirror owner')
          if release.get('original_attribution') != '徐州市政府办公室':
              raise SystemExit('Xuzhou-government source attribution not verified')
          parsed = urlparse(release['url'])
          if parsed.scheme != 'https' or parsed.hostname != 'www.jiangsu.gov.cn':
              raise SystemExit('unexpected mirror provenance host')
          if not release['provenance'].get('payload_sha256'):
              raise SystemExit('missing detail provenance hash')
          metrics = {item['signal_id']: item for item in release['metrics']}
          if 'XZ_GDP' not in metrics or 'XZ_GDP_YOY' not in metrics:
              raise SystemExit('missing Xuzhou GDP core metrics')
          gdp = float(metrics['XZ_GDP']['value'])
          if not 3000 < gdp < 7000:
              raise SystemExit(f'Xuzhou current-period GDP outside broad sanity bounds: {gdp}')
          if data['discovery']['pages_scanned'] > 35:
              raise SystemExit('bounded scan exceeded configured page cap')
          print('title=', release['title'])
          print('publication_date=', release['publication_date'])
          print('freshness=', data['freshness'])
          print('pages_scanned=', data['discovery']['pages_scanned'])
          print('metrics=', json.dumps({k: v['value'] for k, v in metrics.items()}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Xuzhou macro evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuzhou-macro-mirror-evidence
          path: .local/xuzhou_macro_mirror.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
